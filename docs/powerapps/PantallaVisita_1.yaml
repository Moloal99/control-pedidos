Screens:
  PantallaVisita_1:
    Properties:
      Fill: =gFondo
      Height: =App.Height
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: =Set( gConfNuevaVisita, false )
      Width: =App.Width
    Children:
      - ctnVisita:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - cmpEncabezado_6:
                Control: CanvasComponent
                ComponentName: cmpEncabezado
                Properties:
                  Fill: =gNavy
                  Height: =56
                  Width: =Parent.Width
            - ctnVisitaGeneral:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =600
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: |
                    =12
                  PaddingBottom: =14
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =14
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  Width: =Parent.Width
                  Y: =56
                Children:
                  - lblVisitaGeneral:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gTexto
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="DATOS DE LA VISITA"
                  - ctnVisitaDato:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =Color.White
                        FillPortions: =0
                        Height: =340
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                      Children:
                        - lblVisitaDatoClienteTitulo:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =gTextoSec
                              Font: =Font.'Open Sans'
                              Height: =18
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13.5
                              Text: ="Código cliente"
                              Width: |
                                =250
                              X: =14
                              Y: =12
                        - txtVisitaDatoCliente:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Default: '=varCodCliente   '
                              Font: =Font.'Open Sans'
                              Height: =30
                              HoverBorderColor: =RGBA(0, 18, 107, 1)
                              HoverFill: =RGBA(186, 202, 226, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnChange: |-
                                =With(
                                    { locCliente: LookUp( dim_CLIENTES, CLIENTE_CODIGO = Trim( txtVisitaDatoCliente.Text ) ) },
                                    If(
                                        !IsBlank( locCliente ) And !IsBlank( txtVisitaDatoCliente.Text ),
                                        Set( varCodCliente, locCliente.CLIENTE_CODIGO );
                                        Set( varCliente, locCliente );
                                        Reset( cmbVisitaCliente )
                                    )
                                )
                              Reset: =gResetVisita
                              Size: =14
                              Width: |+
                                =350
                        - VisitaDatoCodigoClienteTitulo:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =gTextoSec
                              Font: =Font.'Open Sans'
                              Height: =18
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13.5
                              Text: ="Nombre cliente"
                              Width: |+
                                =250
                              X: =14
                              Y: =12
                        - cmbVisitaCliente:
                            Control: Classic/ComboBox@2.4.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              ChevronBackground: =RGBA(56, 96, 178, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              ChevronHoverFill: =RGBA(255, 255, 255, 1)
                              DefaultSelectedItems: =Filter( dim_CLIENTES, ID = varCliente.ID )
                              DisplayFields: =["CLIENTE_NOMBRE","CLIENTE_CODIGO"]
                              Font: =Font.'Open Sans'
                              Height: =34
                              HoverFill: =RGBA(186, 202, 226, 1)
                              InputTextPlaceholder: ="Buscá por nombre o código"
                              Items: =dim_CLIENTES
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnChange: |-
                                =Set( varCliente, Self.Selected );
                                Set( varCodCliente, Self.Selected.CLIENTE_CODIGO );
                                Reset( txtVisitaDatoCliente )
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 18, 107, 1)
                              Reset: =gResetVisita
                              SearchFields: =["CLIENTE_NOMBRE","CLIENTE_CODIGO"]
                              SelectMultiple: =false
                              SelectionColor: =RGBA(255, 255, 255, 1)
                              SelectionFill: =RGBA(56, 96, 178, 1)
                              Size: =14
                        - lblVisitaDatoMotivo:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =gTextoSec
                              Font: =Font.'Open Sans'
                              Height: =18
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13.5
                              Text: ="Motivo"
                              Width: =Parent.Width - 28
                              X: =14
                              Y: =74
                        - ctnVisitaMotivoData:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =60
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =5
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                            Children:
                              - btnVisitaMotivoRutina:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorFade(Self.Fill, -15%)
                                    Color: =If(gMotivo="Rutina", Color.White, gTexto)
                                    DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                    Fill: =If(gMotivo="Rutina", gNavy, gChip)
                                    Font: =Font.'Open Sans'
                                    Height: =30
                                    HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    OnSelect: |-
                                      =Set(gMotivo, "Rutina")
                                      ; Set( gVisitaFormaPago, Blank() );
                                      Set( gDiasCredito, Blank() );
                                      Reset( txtVisitaDiasCredito )
                                    PressedBorderColor: =Self.Fill
                                    PressedColor: =Self.Fill
                                    PressedFill: =Self.Color
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =8
                                    Size: =13.5
                                    Text: ="Rutina"
                                    Width: =(Parent.Width - 36) / 3
                                    X: =btnVisitaMotivoCobranza.X + btnVisitaMotivoCobranza.Width + 4
                                    Y: =96
                              - btnVisitaMotivoCobranza:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorFade(Self.Fill, -15%)
                                    Color: =If(gMotivo="Cobranza", Color.White, gTexto)
                                    DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                    Fill: =If(gMotivo="Cobranza", gNavy, gChip)
                                    Font: =Font.'Open Sans'
                                    Height: =30
                                    HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    OnSelect: |-
                                      =Set(gMotivo, "Cobranza")
                                      ; Set( gVisitaFormaPago, Blank() );
                                      Set( gDiasCredito, Blank() );
                                      Reset( txtVisitaDiasCredito )
                                    PressedBorderColor: =Self.Fill
                                    PressedColor: =Self.Fill
                                    PressedFill: =Self.Color
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =13.5
                                    Text: ="Cobranza"
                                    Width: =(Parent.Width - 36) / 3
                                    X: =btnVisitaMotivoPedido.X + btnVisitaMotivoPedido.Width + 4
                                    Y: =96
                              - btnVisitaMotivoPedido:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorFade(Self.Fill, -15%)
                                    Color: =If(gMotivo="Pedido", Color.White, gTexto)
                                    DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                    Fill: =If(gMotivo="Pedido", gNavy, gChip)
                                    Font: =Font.'Open Sans'
                                    Height: =30
                                    HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    OnSelect: =Set(gMotivo, "Pedido")
                                    PressedBorderColor: =Self.Fill
                                    PressedColor: =Self.Fill
                                    PressedFill: =Self.Color
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =0
                                    Size: =13.5
                                    Text: ="Pedido"
                                    Width: =(Parent.Width - 36) / 3
                                    X: =14
                                    Y: =96
                        - ctnVisitaFormaPago:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =120
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              Visible: =gMotivo = "Pedido"
                            Children:
                              - lblVisitaFormaPagoTitulo:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gTextoSec
                                    Font: =Font.'Open Sans'
                                    Height: =18
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13.5
                                    Text: ="Forma de pago"
                                    Width: =Parent.Width - 28
                                    X: =14
                                    Y: =74
                              - ctnVisitaFormaPagoData:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =20
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                  Children:
                                    - btnVisitaFormaPagoCredito:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =If( gVisitaFormaPago = "Crédito", RGBA(255, 255, 255, 1), RGBA(60, 60, 60, 1) )
                                          DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                          Fill: |+
                                            =If( gVisitaFormaPago = "Crédito", RGBA(20, 60, 130, 1), RGBA(240, 242, 245, 1) )
                                          Font: =Font.'Open Sans'
                                          Height: =30
                                          HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                          OnSelect: =Set( gVisitaFormaPago, "Crédito" )
                                          PressedBorderColor: =Self.Fill
                                          PressedColor: =Self.Fill
                                          PressedFill: =Self.Color
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: |+
                                            =8
                                          RadiusTopRight: =8
                                          Size: =13.5
                                          Text: ="Crédito"
                                          Width: =(Parent.Width - 32) / 2
                                          X: =btnVisitaFormaPagoContado.X + btnVisitaFormaPagoContado.Width + 4
                                          Y: =96
                                    - btnVisitaFormaPagoContado:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =If( gVisitaFormaPago = "Contado", RGBA(255, 255, 255, 1), RGBA(60, 60, 60, 1) )
                                          DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                          Fill: =If( gVisitaFormaPago = "Contado", RGBA(20, 60, 130, 1), RGBA(240, 242, 245, 1) )
                                          Font: =Font.'Open Sans'
                                          Height: =30
                                          HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                          OnSelect: =Set( gVisitaFormaPago, "Contado" ); Reset( txtVisitaDiasCredito )
                                          PressedBorderColor: =Self.Fill
                                          PressedColor: =Self.Fill
                                          PressedFill: =Self.Color
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: |+
                                            =8
                                          Size: =13.5
                                          Text: ="Contado"
                                          Width: =(Parent.Width - 32) / 2
                                          X: =14
                                          Y: =96
                              - ctnVisitaDiasCredito:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    Visible: =gVisitaFormaPago = "Crédito"
                                    Width: =330
                                  Children:
                                    - lblVisitaFormaPagoTitulo_1:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =gTextoSec
                                          Font: =Font.'Open Sans'
                                          Height: =18
                                          LayoutMinWidth: |+
                                            =30
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13.5
                                          Text: ="Días de crédito"
                                          Width: =140
                                          X: =14
                                          Y: =74
                                    - txtVisitaDiasCredito:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Default: =
                                          Font: =Font.'Open Sans'
                                          Format: =TextFormat.Number
                                          Height: =30
                                          HintText: ="Número de días..."
                                          HoverBorderColor: =RGBA(0, 18, 107, 1)
                                          HoverFill: =RGBA(186, 202, 226, 1)
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =20
                                          MaxLength: =2
                                          Reset: =gResetVisita
                                          Size: =10.5
                                          Width: =120
                  - ctnVisitaComentarioData:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =220
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                      Children:
                        - crdVisitaComentarioData:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =gLinea
                              BorderThickness: =1
                              Fill: =Color.White
                              FillPortions: =0
                              Height: =Parent.Height
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                            Children:
                              - lblVisitaComentarioTitulo:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gTextoSec
                                    Font: =Font.'Open Sans'
                                    Height: =18
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13.5
                                    Text: ="¿Qué pasó en la visita y/o llamada?"
                                    Width: =Parent.Width - 24
                                    X: =12
                                    Y: =95
                              - txtVisitaComentario:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gTexto
                                    Default: =
                                    Font: =Font.'Open Sans'
                                    Height: =If( gPuedeElegirVendedor, 180, 260 )
                                    HintText: |-
                                      ="Escribí lo relevante de la visita…

                                      En caso de que sea un pedido, Coloca la dirección del pedido aquí..."
                                    HoverBorderColor: =RGBA(0, 18, 107, 1)
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    Mode: =TextMode.MultiLine
                                    RadiusBottomLeft: =14
                                    RadiusBottomRight: =14
                                    RadiusTopLeft: =14
                                    RadiusTopRight: =14
                                    Reset: =gResetVisita
                                    Size: =10
                                    Width: =Parent.Width - 24
                                    X: =12
                                    Y: =124
                              - lblVisitaVendedor:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gTexto
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="VENDEDOR"
                                    Width: =110
                                    X: =12
                                    Y: =15
                              - btnVisitaComentarioLlamada:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =If( gTipoContacto = "Llamada", RGBA(255, 255, 255, 1), RGBA(60, 60, 60, 1) )
                                    DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                    Fill: =If( gTipoContacto = "Llamada", RGBA(20, 60, 130, 1), RGBA(240, 242, 245, 1) )
                                    Font: =Font.'Open Sans'
                                    Height: =30
                                    HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    OnSelect: =Set( gTipoContacto, "Llamada" )
                                    PressedBorderColor: =Self.Fill
                                    PressedColor: =Self.Fill
                                    PressedFill: =Self.Color
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: |
                                      =8
                                    RadiusTopRight: =8
                                    Size: =13.5
                                    Text: ="Llamada"
                                    Width: =(Parent.Width - 28) / 2
                                    X: =12
                                    Y: =53
                              - btnVisitaComentarioVisita:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =If( gTipoContacto = "Visita", RGBA(255, 255, 255, 1), RGBA(60, 60, 60, 1) )
                                    DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                    Fill: =If( gTipoContacto = "Visita", RGBA(20, 60, 130, 1), RGBA(240, 242, 245, 1) )
                                    Font: =Font.'Open Sans'
                                    Height: =30
                                    HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    OnSelect: =Set( gTipoContacto, "Visita" )
                                    PressedBorderColor: =Self.Fill
                                    PressedColor: =Self.Fill
                                    PressedFill: =Self.Color
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: |
                                      =8
                                    Size: =13.5
                                    Text: ="Visita"
                                    Width: =(Parent.Width - 28) / 2
                                    X: =btnVisitaComentarioLlamada.X + btnVisitaComentarioLlamada.Width + 8
                                    Y: =53
                              - lblVisitaVendedorNombre:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =If( gVendedorOk, gNavy, gCritico )
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =26
                                    Size: =12
                                    Text: |-
                                      =If( gVendedorOk,
                                           gVendCod & " — " & gVendNom & If(gEsAdmin, "", ""),
                                          "⚠ Tu usuario no está registrado como vendedor" )
                                    Width: =Parent.Width - 142
                                    X: =130
                                    Y: =13
                              - lblVisitaVendedorTit:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =20
                                    Size: =12
                                    Text: ="CARGAR A NOMBRE DE"
                                    Visible: =gPuedeElegirVendedor
                                    Width: =txtVisitaComentario.Width
                                    X: =txtVisitaComentario.X
                                    Y: =txtVisitaComentario.Y + txtVisitaComentario.Height + 12
                              - cmbVisitaVendedor:
                                  Control: Classic/ComboBox@2.4.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    ChevronBackground: =RGBA(56, 96, 178, 1)
                                    ChevronFill: =RGBA(255, 255, 255, 1)
                                    ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                    DisplayFields: =["VENDEDOR_NOMBRE"]
                                    Font: =Font.'Open Sans'
                                    Height: =40
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    InputTextPlaceholder: ="Elegí el vendedor"
                                    Items: =colVendedoresCarga
                                    OnChange: |-
                                      =If( IsBlank( Self.Selected ),
                                          Set( gVendSel, gVendedor );
                                          Set( gVendCod, gUsrCod );
                                          Set( gVendNom, gUsrNom ),

                                          Set( gVendSel, Self.Selected );
                                          Set( gVendCod, Self.Selected.VENDEDOR_CODIGO );
                                          Set( gVendNom, Self.Selected.VENDEDOR_NOMBRE ) )
                                    PressedColor: =RGBA(255, 255, 255, 1)
                                    PressedFill: =RGBA(0, 18, 107, 1)
                                    Reset: =gResetVisita
                                    SearchFields: =["ComplianceAssetId"]
                                    SelectMultiple: =false
                                    SelectionColor: =RGBA(255, 255, 255, 1)
                                    SelectionFill: =RGBA(56, 96, 178, 1)
                                    Size: =12
                                    Visible: =gPuedeElegirVendedor
                                    Width: =txtVisitaComentario.Width
                                    X: =txtVisitaComentario.X
                                    Y: =lblVisitaVendedorTit.Y + lblVisitaVendedorTit.Height + 4
            - ctnVisitaRegistro:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =80
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - btnRegistrar_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =Color.White
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =gRojo
                        Font: =Font.'Segoe UI'
                        Height: =56
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnSelect: |-
                          =If(
                            Not(IsBlank(gVisita)),

                            /* ================= NUEVA VISITA ================= */
                            If(
                              CountRows( colPedido ) > 0 And Not( gConfNuevaVisita ),

                              /* Hay productos sin guardar: avisa y NO borra nada */
                              Set( gConfNuevaVisita, true );
                              Notify(
                                "Tenés " & CountRows( colPedido ) & " producto(s) cargados sin guardar. " &
                                "Si seguís, se pierden. Volvé a tocar 'Nueva visita' para descartarlos, " &
                                "o andá a Pedido y guardá primero.",
                                NotificationType.Warning
                              ),

                              /* Carrito vacío, o ya confirmó: limpia */
                              Set( gConfNuevaVisita, false );
                              Set( gVisita, Blank() );
                              Set( gVisitaRef, Blank() );
                              Set( varCliente, Blank() );
                              Set( varCodCliente, Blank() );
                              Set( gMotivo, Blank() );
                              Set( gTipoContacto, Blank() );
                              Set( gVisitaFormaPago, Blank() );
                              Set( gDiasCredito, Blank() );
                              Set( gComentario, Blank() );
                              Clear( colPedido );
                              Set( gPedidoGuardado, false );
                              Set( gPedidoResumen, { Lineas: 0, Total: 0 } );

                              /* El vendedor atribuido vuelve a ser el usuario.
                                 Sin esto, la proxima visita hereda la seleccion anterior. */
                              Set( gVendSel, gVendedor );
                              Set( gVendCod, gUsrCod );
                              Set( gVendNom, gUsrNom );

                              Set( gResetVisita, true );
                              Set( gResetVisita, false )
                            ),

                            /* ================= REGISTRAR VISITA ================= */
                            Set( gMsgVisita,
                              If( IsBlank(varCliente),
                                    "Falta seleccionar el cliente",
                                  IsBlank(gVendCod),
                                    "Tu usuario no está registrado como vendedor — avisá a sistemas",
                                  IsBlank(gTipoContacto),
                                    "Falta elegir el tipo de contacto (Visita o Llamada)",
                                  IsBlank(gMotivo),
                                    "Falta elegir el motivo de la visita",
                                  gMotivo = "Pedido" And IsBlank(gVisitaFormaPago),
                                    "Falta elegir la forma de pago (Crédito o Contado)",
                                  gMotivo = "Pedido" And gVisitaFormaPago = "Crédito" And Value(txtVisitaDiasCredito.Text) <= 0,
                                    "Falta indicar los días de crédito",
                                  IsBlank(Trim(txtVisitaComentario.Text)),
                                    "Falta escribir el comentario de la visita",
                                  ""
                              )
                            );

                            If( gMsgVisita <> "",

                              Notify( gMsgVisita, NotificationType.Error ),

                              Set( gDiasCredito,
                                   If( gVisitaFormaPago = "Crédito", Value(txtVisitaDiasCredito.Text) ) );

                              Set( gComentario, Trim(txtVisitaComentario.Text) );

                              Set( gVisita,
                                Patch( fact_VISITAS, Defaults(fact_VISITAS),
                                  {
                                    VISITA_TITULO:
                                      varCliente.CLIENTE_NOMBRE & " - " & Text(Now(), "dd/mm/yyyy hh:mm"),

                                    dim_CLIENTES_ID: {
                                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                      Id:    varCliente.ID,
                                      Value: varCliente.CLIENTE_NOMBRE
                                    },
                                    CLIENTE_CODIGO: varCliente.CLIENTE_CODIGO,
                                    CLIENTE_NOMBRE: varCliente.CLIENTE_NOMBRE,

                                    /* gVendSel es el vendedor ATRIBUIDO: normalmente vos,
                                       o el vendedor cubierto si un supervisor carga por otro. */
                                    dim_VENDEDORES_ID: {
                                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                      Id:    gVendSel.ID,
                                      Value: gVendSel.VENDEDOR_NOMBRE
                                    },
                                    VENDEDOR_CODIGO: gVendCod,
                                    VENDEDOR_NOMBRE: gVendNom,

                                    /* Quien lo tipeo. Vacio cuando es el propio vendedor. */
                                    CARGADO_POR: If( gVendCod <> gUsrCod, gUsrNom, "" ),

                                    VISITA_MOTIVO:        { Value: gMotivo },
                                    VISITA_TIPO_CONTACTO: { Value: gTipoContacto },
                                    VISITA_FORMA_PAGO:    If( gMotivo = "Pedido" And Not(IsBlank(gVisitaFormaPago)),
                                                              { Value: gVisitaFormaPago } ),
                                    VISITA_DIAS_CREDITO:  gDiasCredito,
                                    VISITA_COMENTARIO:    Trim(txtVisitaComentario.Text),
                                    VISITA_FECHA:         Now()
                                  }
                                )
                              );

                              Set( gVisitaRef, {
                                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                Id:    gVisita.ID,
                                Value: gVisita.VISITA_TITULO
                              } );

                              Notify(
                                If( gVendCod <> gUsrCod,
                                    "Visita registrada a nombre de " & gVendNom & " — ya podés cargar pedido",
                                    "Visita registrada — ya podés cargar pedido" ),
                                NotificationType.Success )
                            )
                          )
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =gRojoDark
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Size: =15
                        Text: =If( IsBlank(gVisita), "Registrar visita", "Nueva visita" )
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =712
            - cmpPantalla_1:
                Control: CanvasComponent
                ComponentName: cmpPantalla
                Properties:
                  Height: =80
                  OnCobranza: =Navigate(PantallaCobranza_1)
                  OnCompetencia: =Navigate(PantallaCompetencia_1)
                  OnPedido: =Navigate(PantallaPedido_1)
                  OnVisita: =Navigate(PantallaVisita_1)
                  Visible: =gVeOtrasPantallas
                  Width: =Parent.Width

