                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =gRojo
                  Font: =Font.'Segoe UI'
                  Height: =56
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |-
                    =Set( gCompNombre,
                        With( { t: Trim( txtCompCompetidor.Text ) },
                            Upper( Left( t, 1 ) ) & Lower( Mid( t, 2 ) ) ) );
                    Set( gCompDesc,   Trim( txtCompDesc.Text ) );
                    Set( gCompUnidad, Trim( drpCompUnidad.Selected.Value ) );

                    Set( gCompMsg,
                        If( IsBlank( gCompCliente ),                 "Elegí el cliente",
                            gCompNombre = "",                        "Escribí el competidor",
                            IsBlank( gCompTipo ),                    "Elegí el tipo de producto",
                            gCompDesc = "",                          "Escribí la descripción del producto",
                            gCompUnidad = "",                        "Elegí la unidad",
                            Value( txtCompPrecio.Text ) <= 0,        "El precio tiene que ser mayor a cero",
                            Value( txtCompCant.Text ) < 1,           "La cantidad tiene que ser 1 o más",
                            Upper( gCompUnidad ) = "PZA" And
                                Value( txtCompCant.Text ) <> RoundDown( Value( txtCompCant.Text ), 0 ),
                                                                     "Las piezas se cuentan enteras",
                            "" ) );

                    If( gCompMsg <> "",

                        Notify( gCompMsg, NotificationType.Error ),

                        Set( gCompNuevo,
                            Patch( fact_COMPETENCIA, Defaults( fact_COMPETENCIA ),
                                {
                                    Title:              "REL-" & gVendCod & "-" & Text( Now(), "yyyymmdd-hhmmss" ),
                                    RELEVAMIENTO_FECHA: Now(),
                                    VENDEDOR_CODIGO:    gVendCod,
                                    VENDEDOR_NOMBRE:    gVendNom,
                                    dim_CLIENTES_ID: {
                                        '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                        Id:    gCompCliente.ID,
                                        Value: gCompCliente.CLIENTE_NOMBRE
                                    },
                                    CLIENTE_CODIGO:   gCompCliente.CLIENTE_CODIGO,
                                    CLIENTE_NOMBRE:   gCompCliente.CLIENTE_NOMBRE,
                                    COMPETIDOR:       gCompNombre,
                                    COMP_TIPO:        { Value: gCompTipo },
                                    COMP_DESCRIPCION: gCompDesc,
                                    COMP_MEDIDA:      Trim( txtCompMedida.Text ),
                                    COMP_UNIDAD:      gCompUnidad,
                                    COMP_PRECIO:      Value( txtCompPrecio.Text ),
                                    COMP_CANTIDAD:    Value( txtCompCant.Text ),
                                    COMP_OBSERVACION: Trim( txtCompObs.Text )
                                } ) );

                        If( IsBlank( gCompNuevo.ID ) Or gCompNuevo.ID = 0,

                            Notify( "No se pudo guardar el relevamiento. Volvé a intentar.", NotificationType.Error ),

                            Collect( colCompHoy, gCompNuevo );
                            Notify( "Guardado · " & gCompNombre & " · " & gCompDesc, NotificationType.Success );
                            Set( gCompTipo, Blank() );
                            Reset( txtCompDesc ); Reset( txtCompMedida ); Reset( drpCompUnidad );
                            Reset( txtCompPrecio ); Reset( txtCompCant ); Reset( txtCompObs )
                        )
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =gRojoDark
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =15
                  Text: ="Guardar relevamiento"
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =712
            - cmpPantalla_4:
                Control: CanvasComponent
                ComponentName: cmpPantalla
                Properties:
                  Height: =80
                  OnCobranza: =Navigate(PantallaCobranza_1)
                  OnCompetencia: =Navigate(PantallaCompetencia_1)
                  OnPedido: =Navigate(PantallaPedido_1)
                  OnVisita: =Navigate(PantallaVisita_1)
                  Visible: =gVeOtrasPantallas
                  Width: =Parent.Width

