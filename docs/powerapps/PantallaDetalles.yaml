                                    Color: =gRojo
                                    Font: =Font.'Open Sans'
                                    Height: =18 * gMaxLineasNota
                                    OnSelect: =Select(Parent)
                                    Size: =9
                                    Text: |-
                                      ="Motivo: " & ThisItem.NOTA_ANULADA_MOTIVO & Char(10) &
                                      "Anulada por " & ThisItem.NOTA_ANULADA_POR & " el " &
                                      Text( ThisItem.NOTA_ANULADA_FECHA, "dd/mm/yyyy hh:mm" )
                                    Visible: =ThisItem.NOTA_ANULADA
                                    Width: =lblGNvProductos.Width
                                    X: =lblGNvProductos.X
                                    Y: =lblGNvProductos.Y
                        - frmNota:
                            Control: Form@2.4.4
                            Variant: Classic
                            Layout: Vertical
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              DataSource: =fact_NOTAS_VENTA
                              DefaultMode: =FormMode.New
                              Height: =142
                              OnSuccess: |-
                                =Set( gNotaNueva, LookUp( fact_NOTAS_VENTA, ID = frmNota.LastSubmit.ID ) );
                                Set( gNotaAdjOk, CountRows( gNotaNueva.'Datos adjuntos' ) > 0 );

                                If(
                                    Not( gNotaAdjOk ),

                                    Remove( fact_NOTAS_VENTA, LookUp( fact_NOTAS_VENTA, ID = gNotaNueva.ID ) );
                                    Notify( "El comprobante no se guardó. La nota no se creó, volvé a intentar.", NotificationType.Error ),

                                    IfError(
                                        Patch( fact_NOTAS_VENTA, gNotaNueva,
                                            {
                                                Title:                  gNotaNro,
                                                NOTA_NUMERO:            gNotaNro,
                                                PROFORMA_CLAVE:         gProfSel.PROFORMA_CLAVE,
                                                PROFORMA_NUMERO:        gProfSel.PROFORMA_NUMERO,
                                                PEDIDO_NUMERO:          gTicketSel.PEDIDO_NUMERO,
                                                dim_CLIENTES_ID: {
                                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                                    Id:    gTicketSel.dim_CLIENTES_ID.Id,
                                                    Value: gTicketSel.dim_CLIENTES_ID.Value
                                                },
                                                CLIENTE_CODIGO:         gTicketSel.CLIENTE_CODIGO,
                                                CLIENTE_NOMBRE:         gTicketSel.CLIENTE_NOMBRE,
                                                VENDEDOR_CODIGO:        gTicketSel.VENDEDOR_CODIGO,
                                                VENDEDOR_NOMBRE:        gTicketSel.VENDEDOR_NOMBRE,
                                                NOTA_ALMACEN:           gProfSel.PROFORMA_ALMACEN,
                                                NOTA_FECHA:             Now(),
                                                NOTA_TOTAL:             gNotaTot,
                                                NOTA_TOTAL_PAGADO:      0,
                                                NOTA_SALDO_PENDIENTE:   gNotaTot,
                                                NOTA_ESTADO_PAGO:       { Value: "Pendiente" },
                                                NOTA_FORMA_PAGO:        gTicketSel.PEDIDO_FORMA_PAGO,
                                                NOTA_DIAS_CREDITO:      gTicketSel.PEDIDO_DIAS_CREDITO,
                                                NOTA_FECHA_VENCIMIENTO: gTicketSel.PEDIDO_FECHA_VENCIMIENTO,
                                                NOTA_ANULADA:           false
                                            }
                                        ); false,
                                        Notify( "No se pudieron guardar los datos de la nota: " & FirstError.Message, NotificationType.Error )
                                    );

                                    ClearCollect( colNotaCheck,
                                        ForAll( colNotaEnvio As d,
                                            Patch( fact_NOTA_LINEAS, Defaults( fact_NOTA_LINEAS ),
                                                {
                                                    Title:                     gNotaNro,
                                                    NOTA_NUMERO:               gNotaNro,
                                                    PROFORMA_CLAVE:            Text( gProfSel.PROFORMA_CLAVE ),
                                                    PRODUCTO_TERMINADO_CODIGO: Text( d.PRODUCTO_TERMINADO_CODIGO ),
                                                    PRODUCTO_DESCRIPCION:      Text( d.PRODUCTO_DESCRIPCION ),
                                                    PRODUCTO_UNIDAD:           Text( d.PRODUCTO_UNIDAD ),
                                                    LINEA_ALMACEN:             Text( d.LINEA_ALMACEN ),
                                                    LINEA_CANTIDAD:            Value( d.ADespachar ),
                                                    LINEA_PRECIO_UNITARIO:     Value( Coalesce( d.LINEA_PRECIO_UNITARIO, 0 ) ),
                                                    PRODUCTO_PESO_PROMEDIO:    Value( Coalesce( d.PRODUCTO_PESO_PROMEDIO, 0 ) )
                                                }
                                            )
                                        )
                                    );

                                    If( CountRows( colNotaCheck ) <> gNotaCant
                                        Or CountRows( Filter( colNotaCheck, IsBlank( ID ) Or ID = 0 ) ) > 0,

                                        Refresh( fact_NOTA_LINEAS );
                                        ClearCollect( colNotaBorrar, Filter( fact_NOTA_LINEAS, NOTA_NUMERO = gNotaNro ) );
                                        ForAll( colNotaBorrar As x, Remove( fact_NOTA_LINEAS, LookUp( fact_NOTA_LINEAS, ID = x.ID ) ) );
                                        Remove( fact_NOTAS_VENTA, LookUp( fact_NOTAS_VENTA, ID = gNotaNueva.ID ) );
                                        Notify( "La nota no se guardó completa. Se deshizo todo.", NotificationType.Error ),

                                        Collect( colTicketNotas, LookUp( fact_NOTAS_VENTA, ID = gNotaNueva.ID ) );
                                        Collect( colTicketNotaLineas, colNotaCheck );
                                        Collect( colLineasActivas, colNotaCheck );

                                        ClearCollect( colProfLineas,
                                            ForAll( Filter( colTicketLineas, PROFORMA_CLAVE = gProfSel.PROFORMA_CLAVE ) As pl,
                                                With(
                                                    { desp: Sum( Filter( colLineasActivas,
                                                                PROFORMA_CLAVE = pl.PROFORMA_CLAVE And
                                                                PRODUCTO_TERMINADO_CODIGO = pl.PRODUCTO_TERMINADO_CODIGO ),
                                                              LINEA_CANTIDAD ) },
                                                    {
                                                        ID:                        pl.ID,
                                                        PRODUCTO_TERMINADO_CODIGO: pl.PRODUCTO_TERMINADO_CODIGO,
                                                        PRODUCTO_DESCRIPCION:      pl.PRODUCTO_DESCRIPCION,
                                                        PRODUCTO_UNIDAD:           pl.PRODUCTO_UNIDAD,
                                                        PRODUCTO_PESO_PROMEDIO:    Coalesce( pl.PRODUCTO_PESO_PROMEDIO, 0 ),
                                                        LINEA_ALMACEN:             pl.LINEA_ALMACEN,
                                                        PROFORMA_CLAVE:            pl.PROFORMA_CLAVE,
                                                        LINEA_CANTIDAD:            pl.LINEA_CANTIDAD,
                                                        LINEA_PRECIO_UNITARIO:     Coalesce( pl.LINEA_PRECIO_UNITARIO, 0 ),
                                                        Despachado:                desp,
                                                        Pendiente:                 pl.LINEA_CANTIDAD - desp,
                                                        ADespachar:                0
                                                    }
                                                )
                                            ) );

                                        ClearCollect( colProfNotas,
                                            Filter( colTicketNotas, PROFORMA_CLAVE = gProfSel.PROFORMA_CLAVE ) );
                                        ClearCollect( colProfNotaLineas,
                                            Filter( colTicketNotaLineas, PROFORMA_CLAVE = gProfSel.PROFORMA_CLAVE ) );
                                        Set( gMaxLineasNota,
                                            Coalesce(
                                                Max( ForAll( colProfNotas As n,
                                                        CountRows( Filter( colProfNotaLineas, NOTA_NUMERO = n.NOTA_NUMERO ) ) ),
                                                     Value ),
                                                1 ) );

                                        With(
                                            { est: If( Sum( colTicketLineas, LINEA_CANTIDAD ) -
