                        - galDetallesProformas:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Height: =CountRows( colTicketProformas ) * 96
                              Items: =colTicketProformas
                              OnSelect: |-
                                =Set( gProfSel, ThisItem );
                                Set( gNvAnularId, 0 );
                                ClearCollect( colProfLineas,
                                    ForAll( Filter( colTicketLineas, PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE ) As pl,
                                        With( { desp: Sum( Filter( colLineasActivas,
                                                    PROFORMA_CLAVE = pl.PROFORMA_CLAVE And
                                                    PRODUCTO_TERMINADO_CODIGO = pl.PRODUCTO_TERMINADO_CODIGO ), LINEA_CANTIDAD ) },
                                            { ID: pl.ID,
                                              PRODUCTO_TERMINADO_CODIGO: pl.PRODUCTO_TERMINADO_CODIGO,
                                              PRODUCTO_DESCRIPCION: pl.PRODUCTO_DESCRIPCION,
                                              PRODUCTO_UNIDAD: pl.PRODUCTO_UNIDAD,
                                              PRODUCTO_PESO_PROMEDIO: Coalesce( pl.PRODUCTO_PESO_PROMEDIO, 0 ),
                                              LINEA_ALMACEN: pl.LINEA_ALMACEN,
                                              PROFORMA_CLAVE: pl.PROFORMA_CLAVE,
                                              LINEA_CANTIDAD: pl.LINEA_CANTIDAD,
                                              LINEA_PRECIO_UNITARIO: Coalesce( pl.LINEA_PRECIO_UNITARIO, 0 ),
                                              Despachado: desp,
                                              Pendiente: pl.LINEA_CANTIDAD - desp,
                                              ADespachar: 0 } ) ) );
                                ClearCollect( colProfNotas, Filter( colTicketNotas, PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE ) );
                                ClearCollect( colProfNotaLineas, Filter( colTicketNotaLineas, PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE ) );
                                Set( gMaxLineasNota,
                                    Coalesce( Max( ForAll( colProfNotas As n,
                                        CountRows( Filter( colProfNotaLineas, NOTA_NUMERO = n.NOTA_NUMERO ) ) ), Value ), 1 ) );
                                Reset( txtDNotaNumero );
                                NewForm( frmNota )
                              ShowScrollbar: =false
                              TemplateFill: =If( ThisItem.ID = gProfSel.ID, gAzulBg, Color.White )
                              TemplatePadding: =0
                              TemplateSize: =96
                              Width: =Parent.Width
                              Y: =lblDetallesProfTitulo.Y + lblDetallesProfTitulo.Height + 6
                            Children:
                              - lblGProfAlmacen:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gNavy
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    OnSelect: =Select(Parent)
                                    Size: =11
                                    Text: =ThisItem.PROFORMA_ALMACEN
                                    Width: =Parent.TemplateWidth - 120
                                    Wrap: =false
                                    X: =12
                                    Y: =8
                              - lblGProfEstado:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: |-
                                      =With(
                                          {
                                              desp: Sum( Filter( colTicketNotaLineas, PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE ),
                                                         LINEA_CANTIDAD ),
                                              tot:  Sum( Filter( colTicketLineas, PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE ),
                                                         LINEA_CANTIDAD )
                                          },
                                          If( IsBlank( ThisItem.PROFORMA_NUMERO ), gGris,
                                              desp >= tot, gVerde,
                                              desp > 0,    gNaranja,
                                                           gNavy )
                                      )
                                    Fill: |-
                                      =Switch( ThisItem.PROFORMA_ESTADO.Value,
                                          "Despachada", ColorValue("#E3F4EC"),
                                          "Parcial",    ColorValue("#FDF1DC"),
                                          "Pendiente",  gAzulBg,
                                          gChip )
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    OnSelect: =Select(Parent)
                                    Size: =10
                                    Text: |-
                                      =With(
                                          {
                                              desp: Sum( Filter( colTicketNotaLineas, PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE ),
                                                         LINEA_CANTIDAD ),
                                              tot:  Sum( Filter( colTicketLineas, PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE ),
                                                         LINEA_CANTIDAD )
                                          },
                                          If( IsBlank( ThisItem.PROFORMA_NUMERO ), "Sin número",
                                              desp >= tot, "Despachada",
                                              desp > 0,    "Parcial",
                                                           "Pendiente" )
                                      )
                                    Width: =96
                                    X: =Parent.TemplateWidth - 108
                                    Y: =8
                              - lblGProfDatos:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gTextoSec
                                    Font: =Font.'Open Sans'
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    Size: =10
                                    Text: |-
                                      ="Bs " & Text( ThisItem.PROFORMA_TOTAL, "#,##0.00" ) & "  ·  " &
                                      CountRows(
                                          Filter( colTicketLineas As pl,
                                              pl.PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE
                                              And pl.LINEA_CANTIDAD > Sum( Filter( colTicketNotaLineas,
                                                      PROFORMA_CLAVE = pl.PROFORMA_CLAVE And
                                                      PRODUCTO_TERMINADO_CODIGO = pl.PRODUCTO_TERMINADO_CODIGO ),
                                                    LINEA_CANTIDAD ) ) ) &
                                      " producto(s) pendiente(s)"
                                    Width: =Parent.TemplateWidth - 24
                                    Wrap: =false
                                    X: =12
                                    Y: =30
                              - txtGProfNumero:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =gLinea
                                    Default: =ThisItem.PROFORMA_NUMERO
                                    DisplayMode: |-
                                      =If(
                                          gProformarTicket And
                                          Coalesce(
                                              Sum( Filter( colLineasActivas, PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE ), LINEA_CANTIDAD ),
                                              0
                                          ) = 0,
                                          DisplayMode.Edit,
                                          DisplayMode.View
                                      )
                                    Font: =Font.'Open Sans'
                                    Height: =36
                                    HintText: ="N° de proforma"
                                    HoverBorderColor: =RGBA(0, 18, 107, 1)
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    OnSelect: =Select(Parent)
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =11
                                    Width: =Parent.TemplateWidth - 60
                                    X: =12
                                    Y: =52
                              - icoGProfGuardar:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    AutoDisableOnSelect: =false
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gVerde
                                    Height: =32
                                    Icon: =Icon.Check
                                    OnSelect: |-
                                      =If( IsBlank( Trim( txtGProfNumero.Text ) ),
                                          Notify( "Escribí el número de la proforma antes de guardar", NotificationType.Error ),

                                          With(
                                              {
                                                  nro:   Trim( txtGProfNumero.Text ),
                                                  desp:  Sum( Filter( colLineasActivas, PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE ),
                                                              LINEA_CANTIDAD ),
                                                  tot:   Sum( Filter( colTicketLineas, PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE ),
                                                              LINEA_CANTIDAD )
                                              },
                                              With(
                                                  { est: If( desp >= tot, "Despachada", desp > 0, "Parcial", "Pendiente" ) },

                                                  IfError(
                                                      Patch( fact_PROFORMAS, LookUp( fact_PROFORMAS, ID = ThisItem.ID ),
                                                          {
                                                              PROFORMA_NUMERO: nro,
                                                              PROFORMA_ESTADO: { Value: est }
                                                          }
                                                      ); false,
                                                      Notify( "No se pudo guardar la proforma: " & FirstError.Message, NotificationType.Error )
                                                  );

                                                  Patch( colTicketProformas, LookUp( colTicketProformas, ID = ThisItem.ID ),
                                                      {
                                                          PROFORMA_NUMERO: nro,
                                                          PROFORMA_ESTADO: { Value: est }
                                                      }
                                                  );

                                                  Notify( "Proforma " & nro & " guardada", NotificationType.Success )
                                              )
                                          );

                                          Set( gProfEditId, 0 );
                                          Set( gProfSel, LookUp( colTicketProformas, ID = ThisItem.ID ) );
                                          Set( gProductosEditables,
                                          CountRows(
                                              Filter( colTicketProformas As p,
                                                  CountRows( Filter( colLineasActivas, PROFORMA_CLAVE = p.PROFORMA_CLAVE ) ) > 0 )
                                          ) = 0 );

                                          ClearCollect( colProfLineas,
                                              ForAll( Filter( colTicketLineas, PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE ) As pl,
                                                  With(
                                                      { d: Sum( Filter( colLineasActivas,
                                                                  PROFORMA_CLAVE = pl.PROFORMA_CLAVE And
                                                                  PRODUCTO_TERMINADO_CODIGO = pl.PRODUCTO_TERMINADO_CODIGO ),
                                                                LINEA_CANTIDAD ) },
                                                      {
                                                          ID:                        pl.ID,
                                                          PRODUCTO_TERMINADO_CODIGO: pl.PRODUCTO_TERMINADO_CODIGO,
                                                          PRODUCTO_DESCRIPCION:      pl.PRODUCTO_DESCRIPCION,
                                                          PRODUCTO_UNIDAD:           pl.PRODUCTO_UNIDAD,
                                                          PRODUCTO_PESO_PROMEDIO:    Coalesce( pl.PRODUCTO_PESO_PROMEDIO, 0 ),
                                                          LINEA_ALMACEN:             pl.LINEA_ALMACEN,
                                                          PROFORMA_CLAVE:            pl.PROFORMA_CLAVE,
                                                          LINEA_CANTIDAD:            pl.LINEA_CANTIDAD,
                                                          LINEA_PRECIO_UNITARIO:     Coalesce( pl.LINEA_PRECIO_UNITARIO, 0 ),
                                                          Despachado:                d,
                                                          Pendiente:                 pl.LINEA_CANTIDAD - d,
                                                          ADespachar:                0
                                                      }
                                                  )
                                              ) );

                                          ClearCollect( colProfNotas,
                                              Filter( colTicketNotas, PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE ) );
                                          ClearCollect( colProfNotaLineas,
                                              Filter( colTicketNotaLineas, PROFORMA_CLAVE = ThisItem.PROFORMA_CLAVE ) );
                                          Set( gMaxLineasNota,
                                              Coalesce(
                                                  Max( ForAll( colProfNotas As n,
                                                          CountRows( Filter( colProfNotaLineas, NOTA_NUMERO = n.NOTA_NUMERO ) ) ),
                                                       Value ),
                                                  1 ) );

                                          If( Coalesce( gTicketSel.PEDIDO_ESTADO_DESPACHO.Value, "" ) = "Sin proforma",
                                              IfError(
                                                  Patch( fact_PEDIDOS, LookUp( fact_PEDIDOS, ID = gTicketSel.ID ),
                                                      { PEDIDO_ESTADO_DESPACHO: { Value: "Proformado" } } ); false,
                                                  Notify( "El estado del pedido no se pudo actualizar", NotificationType.Warning )
                                              );
                                              Set( gTicketSel, Patch( gTicketSel,
                                                  { PEDIDO_ESTADO_DESPACHO: { Value: "Proformado" } } ) )
                                          )
                                      )
                                    Visible: |-
                                      =gProformarTicket And
                                      Coalesce(
