Screens:
  PantallaDetalles:
    Properties:
      Fill: =gFondo
      Height: =App.Height
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set( gTabDetalles, If( gEsCobranzas, "Cobranzas", "Pedidos" ) );
        Set( gSinProforma,        false );
        Set( gModoEdicion,        false );
        Set( gTicketSel,          Blank() );
        Set( gCobranzaSel,        Blank() );
        Set( gCobranzaAdj,        "" );
        Set( gProductosEditables, false );

        /* Permisos por ticket: sin pedido seleccionado, nadie despacha */
        Set( gTicketEsMio,     false );
        Set( gProformarTicket, false );
        Set( gDespacharTicket, false );
        Set( gTicketCargadoPorMi, false );
        Set( gEditarTicket,       false );

        Set( gProfSel, Blank() );
        Clear( colTicketLineas );
        Clear( colProfLineas );
        Reset( txtDetallesBuscar );
        Clear( colProfNotas );
        Clear( colProfNotaLineas );
        NewForm( frmNota )
      Width: =App.Width
    Children:
      - ctnPantallaDetalles:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =gFondo
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - cmpEncabezado_9:
                Control: CanvasComponent
                ComponentName: cmpEncabezado
                Properties:
                  Fill: =gNavy
                  Height: =56
                  Width: =Parent.Width
            - ctnDetallesTabs:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =Color.White
                  FillPortions: =0
                  Height: =58
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =58
                  LayoutMinWidth: =16
                  PaddingBottom: =9
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =9
                Children:
                  - btnTabPedidos:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =If( gTabDetalles = "Pedidos", gNavy, gLinea )
                        BorderThickness: =1
                        Color: =If( gTabDetalles = "Pedidos", Color.White, gTextoSec )
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =If( gTabDetalles = "Pedidos", gNavy, gChip )
                        Font: =Font.'Open Sans'
                        Height: =40
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Set( gTabDetalles, "Pedidos" )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =12
                        Text: ="Pedidos"
                        Visible: =gVeTabPedidos
                        Width: =96
                  - btnTabCobranzas:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =If( gTabDetalles = "Cobranzas", gNavy, gLinea )
                        BorderThickness: =1
                        Color: '=If( gTabDetalles = "Cobranzas", Color.White, gTextoSec )    '
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisplayMode: =If( gModoEdicion, DisplayMode.Disabled, DisplayMode.Edit )
                        Fill: =If( gTabDetalles = "Cobranzas", gNavy, gChip )
                        Font: =Font.'Open Sans'
                        Height: =40
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Set( gTabDetalles, "Cobranzas" )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =12
                        Text: ="Cobranzas"
                        Visible: =gVeTabCobranzas
                        Width: =108
                  - rectDetallesEspaciador:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =Color.Transparent
                        Height: =1
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =12
                  - btnFiltroSinProforma:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =If( gSinProforma, gAmbar, gLinea )
                        BorderThickness: =1
                        Color: =If( gSinProforma, ColorValue("#8A5A00"), gTextoSec )
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisplayMode: =If( gModoEdicion, DisplayMode.Disabled, DisplayMode.Edit )
                        Fill: =If( gSinProforma, ColorValue("#FDF1DC"), Color.White )
                        Font: =Font.'Open Sans'
                        Height: =40
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Set( gSinProforma, Not(gSinProforma) )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =12
                        Text: ="Sin proforma"
                        Visible: =gVeTodosLosPedidos And gTabDetalles = "Pedidos"
                        Width: =112
                  - btnFiltroPendientes:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =If( gPendAprob, gAmbar, gLinea )
                        BorderThickness: =1
                        Color: =If( gPendAprob, ColorValue("#8A5A00"), gTextoSec )
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisplayMode: =If( gModoEdicion, DisplayMode.Disabled, DisplayMode.Edit )
                        Fill: =If( gPendAprob, ColorValue("#FDF1DC"), Color.White )
                        Font: =Font.'Open Sans'
                        Height: =40
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Set( gPendAprob, Not( gPendAprob ) )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =12
                        Text: ="Pendientes"
                        Visible: =gTabDetalles = "Cobranzas" And ( gVeTodasLasCobranzas Or gPuedeConfirmar )
                        Width: =110
                  - dtpDCobDesde:
                      Control: Classic/DatePicker@2.6.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DefaultDate: =Blank()
                        Font: =Font.'Open Sans'
                        Format: ="dd/mm/yyyy"
                        Height: =40
                        IconBackground: =RGBA(56, 96, 178, 1)
                        IconFill: =RGBA(255, 255, 255, 1)
                        InputTextPlaceholder: ="Desde"
                        Language: ="es-BO"
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =12
                        Visible: =gTabDetalles = "Cobranzas"
                        Width: =120
                  - dtpDCobHasta:
                      Control: Classic/DatePicker@2.6.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DefaultDate: =Blank()
                        Font: =Font.'Open Sans'
                        Format: ="dd/mm/yyyy"
                        Height: =40
                        IconBackground: =RGBA(56, 96, 178, 1)
                        IconFill: =RGBA(255, 255, 255, 1)
                        InputTextPlaceholder: ="Hasta"
                        Language: ="es-BO"
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =12
                        Visible: =gTabDetalles = "Cobranzas"
                        Width: =120
                  - icoDCobFechasLimpiar:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AutoDisableOnSelect: =false
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gTextoSec
                        Height: =40
                        Icon: =Icon.Cancel
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Reset( dtpDCobDesde ); Reset( dtpDCobHasta )
                        PaddingBottom: =10
                        PaddingTop: =10
                        Visible: =gTabDetalles = "Cobranzas" And ( Not( IsBlank( dtpDCobDesde.SelectedDate ) ) Or Not( IsBlank( dtpDCobHasta.SelectedDate ) ) )
                        Width: =28
            - txtDetallesBuscar:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =gLinea
                  Default: =""
                  DelayOutput: =true
                  Font: =Font.'Open Sans'
                  Height: =40
                  HintText: |-
                    =If( gTabDetalles = "Cobranzas",
                        "Buscar por nota, cliente o vendedor",
                        "Buscar por cliente o vendedor" )
                  HoverBorderColor: =RGBA(0, 18, 107, 1)
                  HoverFill: =RGBA(186, 202, 226, 1)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =11
                  Visible: =Not( gModoEdicion )
                  Width: =Parent.Width
                  Y: =40
            - ctnPantallaDetallesDatos:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =Color.White
                  Height: =656
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: |
                    =12
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =14
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =14
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  Width: =Parent.Width
                  Y: =56
                Children:
                  - lblDetallesListaTitulo:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gTexto
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: |-
                          =If( gTabDetalles = "Cobranzas",
                              If( gEsCobranzas, "COBRANZAS POR CONFIRMAR",
                                  If( gVeTodasLasCobranzas, "TODAS LAS COBRANZAS", "MIS COBRANZAS" ) ),
                              If( gVeTodosLosPedidos, "TODOS LOS PEDIDOS", "MIS PEDIDOS" ) )
                        Visible: =Not( gModoEdicion )
                  - cardDetallesLista:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =gLinea
                        BorderThickness: =1
                        Fill: =Color.White
                        FillPortions: =0
                        Height: =galDetallesPedidos.Y + galDetallesPedidos.Height + 4
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Visible: =gTabDetalles = "Cobranzas" Or Not( gModoEdicion )
                      Children:
                        - galDetallesPedidos:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              DisplayMode: =If( gModoEdicion, DisplayMode.Disabled, DisplayMode.Edit )
                              Height: =390
                              Items: |-
                                =With( { s: Trim( txtDetallesBuscar.Text ) },
                                    SortByColumns(
                                        Filter(
                                            If( gVeTodosLosPedidos,
                                                Filter( fact_PEDIDOS, PEDIDO_FECHA >= gDesde ),
                                                Filter( fact_PEDIDOS, VENDEDOR_CODIGO = gVendCod, PEDIDO_FECHA >= gDesde ) ),

                                            ( Not( gSinProforma ) Or PEDIDO_ESTADO_DESPACHO.Value = "Sin proforma" ) And
                                            ( IsBlank( s )
                                              Or StartsWith( CLIENTE_NOMBRE, s )
                                              Or StartsWith( VENDEDOR_NOMBRE, s ) )
                                        ),
                                        "PEDIDO_FECHA", SortOrder.Descending
                                    )
                                )
                              OnSelect: |-
                                =Set( gBorrarPedidoConf, false );
                                Set( gTicketSel, ThisItem );
                                Set( gModoEdicion, false );
                                Set( gProfSel, Blank() );
                                Set( gNvAnularId, 0 );

                                Concurrent(
                                    ClearCollect( colTicketLineas,
                                        Filter( fact_PEDIDO_LINEAS, PEDIDO_NUMERO = ThisItem.PEDIDO_NUMERO ) ),
                                    ClearCollect( colTicketProformas,
                                        Filter( fact_PROFORMAS, PEDIDO_NUMERO = ThisItem.PEDIDO_NUMERO ) ),
                                    ClearCollect( colTicketNotas,
                                        Filter( fact_NOTAS_VENTA, PEDIDO_NUMERO = ThisItem.PEDIDO_NUMERO ) ),
                                    ClearCollect( colTicketNotaLineas,
                                        Filter( fact_NOTA_LINEAS, StartsWith( PROFORMA_CLAVE, ThisItem.PEDIDO_NUMERO ) ) )
                                );

                                ClearCollect( colLineasActivas,
                                    Filter( colTicketNotaLineas As l,
                                        Not( Coalesce( LookUp( colTicketNotas, NOTA_NUMERO = l.NOTA_NUMERO ).NOTA_ANULADA, false ) ) ) );

                                Set( gProductosEditables,
                                    CountRows(
                                        Filter( colTicketProformas As p,
                                            CountRows( Filter( colLineasActivas, PROFORMA_CLAVE = p.PROFORMA_CLAVE ) ) > 0 )
                                    ) = 0 );

                                Clear( colProfLineas );
                                Clear( colProfNotas );
                                Clear( colProfNotaLineas );

                                /* ---------- Permisos de ESTE ticket ----------
                                   Se comparan contra gUsrCod / gUsrNom, la identidad REAL del usuario,
                                   nunca contra gVendCod, que un supervisor puede estar cambiando. */
                                Set( gTicketEsMio,        gTicketSel.VENDEDOR_CODIGO = gUsrCod );
                                Set( gTicketCargadoPorMi, Coalesce( gTicketSel.CARGADO_POR, "" ) = gUsrNom );

                                Set( gProformarTicket, gEsAdmin Or gEsAlmacen Or ( gVendedorDespacha And gTicketEsMio ) );
                                Set( gDespacharTicket, gEsAdmin Or gEsAlmacen Or ( gVendedorDespacha And gTicketEsMio ) );

                                Set( gEditarTicket, gEsAdmin Or gEsAlmacen Or gTicketEsMio Or gTicketCargadoPorMi )
                              TemplateFill: =If( ThisItem.ID = gTicketSel.ID, gAzulBg, Color.White )
                              TemplateSize: =78
                              Visible: =gTabDetalles = "Pedidos"
                              Width: =Parent.Width
                            Children:
                              - lblGTicProforma:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: |-
                                      =Switch( ThisItem.PEDIDO_ESTADO_DESPACHO.Value,
                                          "Despachado total",   gVerde,
                                          "Despachado parcial", gNaranja,
                                          "Proformado",         gAzul,
                                          gAmbar )
                                    Font: =Font.'Open Sans'
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    Size: =10
                                    Text: |-
                                      =Switch( ThisItem.PEDIDO_ESTADO_DESPACHO.Value,
                                          "Despachado total",   "Despachado",
                                          "Despachado parcial", "Parcial",
                                          "Proformado",         "Proformado",
                                          "Sin proforma" )
                                    Width: =120
                                    X: =Parent.TemplateWidth - 132
                                    Y: =52
                              - lblGTicFecha:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gTextoSec
                                    Font: =Font.'Open Sans'
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    Size: =10
                                    Text: =Text( ThisItem.PEDIDO_FECHA, "dd/mm/yyyy" ) & If( gEsAdmin, "  ·  " & ThisItem.VENDEDOR_NOMBRE, "" )
                                    Width: =Parent.TemplateWidth - 140
                                    X: =12
                                    Y: =52
                              - lblGTicTotal:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: '=gTexto  '
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    OnSelect: =Select(Parent)
                                    Size: =12
                                    Text: ="Bs " & Text( ThisItem.PEDIDO_TOTAL, "#,##0.00" )
                                    Width: =120
                                    X: =Parent.TemplateWidth - 132
                                    Y: =32
                              - lblGTicCliente:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gTexto
                                    Font: =Font.'Open Sans'
                                    Height: |+
                                      =20
                                    OnSelect: =Select(Parent)
                                    Size: =12
                                    Text: =ThisItem.CLIENTE_NOMBRE
                                    Width: =Parent.TemplateWidth - 140
                                    X: =12
                                    Y: =32
                              - lblGTicEstado:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: |-
                                      =Switch( ThisItem.PEDIDO_ESTADO_PAGO.Value,
                                          "Pagado",  gVerde,
                                          "Parcial", ColorValue("#8A5A00"),
                                          gCritico
                                      )
                                    Fill: |-
                                      =Switch( ThisItem.PEDIDO_ESTADO_PAGO.Value,
                                          "Pagado",  ColorValue("#E3F4EC"),
                                          "Parcial", ColorValue("#FDF1DC"),
                                          ColorValue("#FBE7E9")
                                      )
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    OnSelect: =Select(Parent)
                                    Size: =10
                                    Text: =ThisItem.PEDIDO_ESTADO_PAGO.Value
                                    Width: =84
                                    X: =Parent.TemplateWidth - 96
                                    Y: =10
                              - lblGTicNro:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gNavy
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    OnSelect: =Select(Parent)
                                    Size: =12
                                    Text: =ThisItem.PEDIDO_NUMERO
                                    Width: =Parent.TemplateWidth - 120
                                    X: =12
                                    Y: =10
                              - rectGTicSeparador:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Fill: =gLinea
                                    Height: =1
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - 1
                        - lblDetallesSinTickets:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =gTextoSec
                              Font: =Font.'Open Sans'
                              Height: =40
                              Size: =12
                              Text: |-
                                =If( gTabDetalles = "Pedidos",
                                    If( gSinProforma, "No hay pedidos sin proforma", "No hay pedidos para mostrar" ),
                                    "No hay cobranzas para mostrar"
                                )
                              Visible: |-
                                =If( gTabDetalles = "Pedidos",
                                    CountRows( galDetallesPedidos.AllItems ) = 0,
                                    CountRows( galDetallesCobranzas.AllItems ) = 0 )
                              Width: =Parent.Width - 24
                              X: =12
                              Y: =galDetallesPedidos.Y + 12
                        - galDetallesCobranzas:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Height: =390
                              Items: |-
                                =With(
                                    { s: Trim( txtDetallesBuscar.Text ),
                                      d: Coalesce( dtpDCobDesde.SelectedDate, gDesde ),
                                      h: DateAdd( Coalesce( dtpDCobHasta.SelectedDate, Today() ), 1, TimeUnit.Days ) },
                                    SortByColumns(
                                        Filter(
                                            If( gEsAdmin Or gEsCobranzas,
                                                Filter( fact_COBRANZAS, COBRANZA_FECHA >= d, COBRANZA_FECHA < h ),
                                                Filter( fact_COBRANZAS, VENDEDOR_CODIGO = gVendCod, COBRANZA_FECHA >= d, COBRANZA_FECHA < h ) ),
                                            COBRANZA_HUBO_PAGO = true,
                                            ( Not( gPendAprob ) Or COBRANZA_ESTADO.Value = "Pendiente de confirmación" ),
                                            ( IsBlank( s )
                                              Or StartsWith( NOTA_NUMERO, s )
                                              Or StartsWith( CLIENTE_NOMBRE, s )
                                              Or StartsWith( VENDEDOR_NOMBRE, s ) )
                                        ),
                                        "COBRANZA_FECHA", SortOrder.Descending
                                    )
                                )
                              OnSelect: |-
                                =Set( gCobranzaSel, LookUp( fact_COBRANZAS, ID = ThisItem.ID ) );
                                Reset( txtDCobConf )
                              TemplateFill: =If( ThisItem.ID = gCobranzaSel.ID, gAzulBg, Color.White )
                              TemplatePadding: =0
                              TemplateSize: =94
                              Visible: =gTabDetalles = "Cobranzas"
                              Width: =Parent.Width
                            Children:
                              - lblGCobPedido:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gNavy
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    OnSelect: =Select(Parent)
                                    Size: =12
                                    Text: ="Nota " & ThisItem.NOTA_NUMERO
                                    Width: =Parent.TemplateWidth - 120
                                    Wrap: =false
                                    X: =12
                                    Y: =10
                              - lblGCobTipo:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: |-
                                      =If( Not(ThisItem.COBRANZA_HUBO_PAGO), gTextoSec,
                                          Switch( ThisItem.COBRANZA_TIPO_PAGO.Value,
                                              "Completo", gVerde,
                                              "Parcial",  ColorValue("#8A5A00"),
                                              gAzul
                                          )
                                      )
                                    Fill: |-
                                      =If( Not(ThisItem.COBRANZA_HUBO_PAGO), gChip,
                                          Switch( ThisItem.COBRANZA_TIPO_PAGO.Value,
                                              "Completo", ColorValue("#E3F4EC"),
                                              "Parcial",  ColorValue("#FDF1DC"),
                                              gAzulBg
                                          )
                                      )
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    OnSelect: =Select(Parent)
                                    Size: =9
                                    Text: =ThisItem.COBRANZA_FORMA_PAGO.Value
                                    Width: =120
                                    Wrap: =false
                                    X: =Parent.Width - 132
                                    Y: =10
                              - lblGCobMonto:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gVerde
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    OnSelect: =Select(Parent)
                                    Size: =12
                                    Text: ="Bs " & Text( ThisItem.COBRANZA_MONTO, "#,##0.00" )
                                    Width: |+
                                      =120
                                    Wrap: =false
