                                          LINEA_CANTIDAD & " " & PRODUCTO_UNIDAD & "  ·  " & PRODUCTO_DESCRIPCION,
                                          Char(10)
                                      )
                                    Visible: =Not( ThisItem.NOTA_ANULADA )
                                    Width: =Parent.TemplateWidth - 60
                                    Wrap: =false
                                    X: =12
                                    Y: =lblGNvDatos.Y + 20
                              - icoGNvComprobante:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    AutoDisableOnSelect: =false
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gAzul
                                    Height: =20
                                    Icon: =Icon.Document
                                    OnSelect: |-
                                      =With( { adj: LookUp( fact_NOTAS_VENTA, ID = ThisItem.ID ).'Datos adjuntos' },
                                          If( CountRows( adj ) > 0,
                                              Launch( First( adj ).AbsoluteUri ),
                                              Notify( "Esta nota no tiene comprobante adjunto", NotificationType.Warning ) ) )
                                    Visible: =Not( ThisItem.NOTA_ANULADA )
                                    Width: =20
                                    X: =icoGNvBorrar.X - 28
                                    Y: =icoGNvBorrar.Y
                              - lblGNvMotivo:
