                        - txtDEdNuevaCant:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Default: =""
                              Font: =Font.'Open Sans'
                              Format: =TextFormat.Number
                              Height: =40
                              HintText: =If( IsBlank(cmbDEdProducto.Selected), "Cantidad", "Cantidad en " & cmbDEdProducto.Selected.PRODUCTO_UNIDAD )
