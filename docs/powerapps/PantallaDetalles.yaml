                        - btnDCobConfirmar:
                            Control: Classic/Button@2.2.0
                            Properties:
                              AutoDisableOnSelect: =false
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              Color: =Color.White
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              DisplayMode: |-
                                =If(
                                    Not( IsBlank( gCobranzaSel ) ) And Len( Trim( txtDCobConf.Text ) ) >= 3,
                                    DisplayMode.Edit,
                                    DisplayMode.Disabled
                                )
                              Fill: =gVerde
                              Font: =Font.'Open Sans'
                              Height: =40
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              OnSelect: |-
                                =Set( gCobLive, If( IsBlank( gCobranzaSel ), Blank(), LookUp( fact_COBRANZAS, ID = gCobranzaSel.ID ) ) );

                                If(
                                    IsBlank( gCobranzaSel ),
                                    Notify( "Seleccioná una cobranza", NotificationType.Error ),

                                    IsBlank( gCobLive ),
                                    Notify( "Esa cobranza ya no existe. Refrescá la lista.", NotificationType.Error ),

                                    gCobLive.COBRANZA_ESTADO.Value = "Confirmada",
                                    Set( gCobranzaSel, gCobLive );
                                    Notify( "Esta cobranza ya fue confirmada con el N° " & gCobLive.COBRANZA_NUMERO & ". No se volvió a sumar.", NotificationType.Warning ),

                                    IsBlank( Trim( txtDCobConf.Text ) ),
                                    Notify( "Escribí el número de nota de cobranza que dio el sistema", NotificationType.Error ),

                                    Not( IsBlank( LookUp( fact_COBRANZAS, COBRANZA_NUMERO = Trim( txtDCobConf.Text ) ) ) ),
                                    Notify( "Ya existe una cobranza registrada con ese número", NotificationType.Error ),

                                    // 1) Confirmar la cobranza
                                    Set( gConfOk, false );
                                    IfError(
                                        Patch( fact_COBRANZAS, LookUp( fact_COBRANZAS, ID = gCobranzaSel.ID ),
                                            {
                                                COBRANZA_NUMERO:             Trim( txtDCobConf.Text ),
                                                COBRANZA_ESTADO:             { Value: "Confirmada" },
                                                COBRANZA_CONFIRMADA_POR:     gVendNom,
                                                COBRANZA_FECHA_CONFIRMACION: Now()
                                            }
                                        );
                                        Set( gConfOk, true ),
                                        Notify( "No se pudo confirmar: " & FirstError.Message, NotificationType.Error )
                                    );

                                    If( Not( gConfOk ),
                                        Notify( "No llegó la respuesta del servidor. Salí y volvé a entrar antes de reintentar: si la cobranza ya quedó confirmada, la app te lo va a avisar y no va a sumar dos veces.", NotificationType.Error ),

                                        // 2) Actualizar la nota
                                        Set( gNotaUpd, LookUp( fact_NOTAS_VENTA, NOTA_NUMERO = gCobranzaSel.NOTA_NUMERO ) );

                                        If( IsBlank( gNotaUpd ),
                                            Notify( "No encontré la nota " & gCobranzaSel.NOTA_NUMERO & " para actualizar el saldo.",
                                                    NotificationType.Error ),

                                            Set( gPagadoNuevo, Coalesce( gNotaUpd.NOTA_TOTAL_PAGADO, 0 ) + gCobranzaSel.COBRANZA_MONTO );
                                            Set( gSaldoNuevo,  Max( gNotaUpd.NOTA_TOTAL - gPagadoNuevo, 0 ) );

                                            Set( gSaldoOk, false );
                                            IfError(
                                                Patch( fact_NOTAS_VENTA, gNotaUpd,
                                                    {
                                                        NOTA_TOTAL_PAGADO:    gPagadoNuevo,
                                                        NOTA_SALDO_PENDIENTE: gSaldoNuevo,
                                                        NOTA_ESTADO_PAGO: { Value: If( gSaldoNuevo <= 0, "Pagado", "Parcial" ) }
                                                    }
                                                );
                                                Set( gSaldoOk, true );
                                                Notify( "Cobro " & Trim( txtDCobConf.Text ) & " confirmado. Nota " & gCobranzaSel.NOTA_NUMERO &
                                                        ": pagado Bs " & Text( gPagadoNuevo, "#,##0.00" ) &
                                                        ", saldo Bs " & Text( gSaldoNuevo, "#,##0.00" ),
                                                        NotificationType.Success ),
                                                Notify( "El saldo de la nota NO se actualizó: " & FirstError.Message,
                                                        NotificationType.Error )
                                            );

                                            If( Not( gSaldoOk ),

                                                Notify( "La cobranza quedó confirmada con el N° " & Trim( txtDCobConf.Text ) &
                                                        " pero el saldo de la nota no se actualizó. Avisá para corregirlo a mano. No se mandó el correo.",
                                                        NotificationType.Error ),

                                            // 3) Correo de confirmación
                                            Set( gMailVend,
                                                Coalesce(
                                                    LookUp( dim_VENDEDORES,
                                                        VENDEDOR_CODIGO = gCobranzaSel.VENDEDOR_CODIGO ).VENDEDOR_EMAIL,
                                                    "" ) );

                                            Set( gMailCobroCuerpo,
                                                "<div style=""font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#1F2937"">" &
                                                "<h2 style=""color:#0B2E59;margin:0 0 12px"">Cobro confirmado</h2>" &
                                                "<p><b>Nota de venta:</b> " & gCobranzaSel.NOTA_NUMERO & "<br>" &
                                                "<b>Cliente:</b> " & gCobranzaSel.CLIENTE_NOMBRE & "<br>" &
                                                "<b>Vendedor:</b> " & gCobranzaSel.VENDEDOR_NOMBRE & "</p>" &
                                                "<table cellpadding=""6"" style=""border-collapse:collapse;font-size:14px"">" &
                                                "<tr><td><b>Monto cobrado</b></td><td>Bs " &
                                                    Text( gCobranzaSel.COBRANZA_MONTO, "#,##0.00" ) & "</td></tr>" &
                                                "<tr><td><b>Forma de pago</b></td><td>" &
                                                    gCobranzaSel.COBRANZA_FORMA_PAGO.Value & "</td></tr>" &
                                                "<tr><td><b>Total de la nota</b></td><td>Bs " &
                                                    Text( gNotaUpd.NOTA_TOTAL, "#,##0.00" ) & "</td></tr>" &
                                                "<tr><td><b>Pagado acumulado</b></td><td>Bs " &
                                                    Text( gPagadoNuevo, "#,##0.00" ) & "</td></tr>" &
                                                "<tr><td><b>Saldo pendiente</b></td><td>Bs " &
                                                    Text( gSaldoNuevo, "#,##0.00" ) & "</td></tr>" &
                                                "</table>" &
                                                "<p style=""margin-top:16px"">Confirmado por <b>" & gVendNom & "</b> el " &
                                                    Text( Now(), "dd/mm/yyyy hh:mm" ) & ".</p>" &
                                                If( gSaldoNuevo <= 0,
                                                    "<p style=""color:#0F7B3F""><b>La nota quedó totalmente pagada.</b></p>", "" ) &
                                                "</div>" );

                                            IfError(
                                                Office365Outlook.SendEmailV2(
                                                    Trim( gMailVend & ";samuel.jara@analytico.com.py" ),
                                                    "Cobro confirmado · Nota " & gCobranzaSel.NOTA_NUMERO & " · " & gCobranzaSel.CLIENTE_NOMBRE,
                                                    gMailCobroCuerpo
                                                ); false,
                                                Notify( "El cobro se confirmó pero el correo NO se envió a: " & Trim( gMailVend & ";samuel.jara@analytico.com.py" ) & ". Avisales a mano.", NotificationType.Warning )
                                            )
                                            )
                                        );

                                        Set( gCobranzaSel, LookUp( fact_COBRANZAS, ID = gCobranzaSel.ID ) );
                                        Reset( txtDCobConf )
                                    )
                                )
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              Size: =12
                              Text: ="Confirmar cobro"
                              Visible: |-
                                =gPuedeConfirmar
                                And Not( IsBlank( gCobranzaSel ) )
                                And gCobranzaSel.COBRANZA_ESTADO.Value <> "Confirmada"
                              Width: =btnDCobComprobante.Width
                              X: =btnDCobComprobante.X
                              Y: =txtDCobConf.Y + txtDCobConf.Height + 8
                        - icoDCobBorrar:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AutoDisableOnSelect: =false
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =gRojo
                              Height: =24
                              Icon: =Icon.Trash
                              OnSelect: |-
                                =If(
                                    IsBlank( gCobranzaSel ),
                                    Notify( "Seleccioná una cobranza", NotificationType.Error ),

                                    gCobranzaSel.COBRANZA_ESTADO.Value = "Confirmada",
                                    Notify( "Esta cobranza ya fue confirmada. No se puede eliminar.", NotificationType.Error ),

                                    Not( gEsAdmin ) And gCobranzaSel.VENDEDOR_CODIGO <> gVendCod,
                                    Notify( "Solo podés eliminar tus propias cobranzas", NotificationType.Error ),

                                    Set( gCbrBorrarId, gCobranzaSel.ID );

                                    IfError(
                                        Remove( fact_COBRANZAS, LookUp( fact_COBRANZAS, ID = gCbrBorrarId ) ); false,
                                        Notify( "No se pudo eliminar: " & FirstError.Message, NotificationType.Error )
                                    );

                                    If( IsBlank( LookUp( fact_COBRANZAS, ID = gCbrBorrarId ) ),
                                        Set( gCobranzaSel, Blank() );
                                        Notify( "Cobranza eliminada. Podés volver a cargarla desde la pantalla de Cobranza.",
                                                NotificationType.Success ),
                                        Notify( "La cobranza no se eliminó. Intentá de nuevo.", NotificationType.Error )
                                    )
                                )
                              Visible: '=false   '
                              Width: =24
                              X: =btnDCobComprobante.X + btnDCobComprobante.Width - 28
                              Y: =btnDCobComprobante.Y - 32
