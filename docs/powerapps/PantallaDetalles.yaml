                                    Fill: =Switch( ThisItem.NOTA_ESTADO_PAGO.Value, "Pagado", ColorValue("#E3F4EC"), "Parcial", ColorValue("#FDF1DC"), ColorValue("#FBE7E9") )
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
