                                    Fill: =gLinea
                                    Height: =1
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth - 24
                                    X: =12
                                    Y: =Parent.TemplateHeight - 1
                              - lblGNvProductos:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gTextoSec
