                        - txtDEdNuevoPrecio:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Default: =""
                              Font: =Font.'Open Sans'
                              Format: =TextFormat.Number
                              Height: =40
                              HintText: ="Precio unitario Bs"
                              HoverBorderColor: =RGBA(0, 18, 107, 1)
                              HoverFill: =RGBA(186, 202, 226, 1)
                              Size: =12
                              Width: =(Parent.Width - 32) / 2
                              X: =txtDEdNuevaCant.X + txtDEdNuevaCant.Width + 8
                              Y: =txtDEdNuevaCant.Y
                        - btnDEdAgregar:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =gNavySoft
                              Color: =gNavy
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              Fill: =gAzulBg
                              Font: =Font.'Open Sans'
                              Height: =38
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              OnSelect: |-
                                =Set( gUnidadNueva, Upper( Trim( cmbDEdProducto.Selected.PRODUCTO_UNIDAD ) ) );

                                Set( gAlmacenNuevo,
                                    With( { cod: cmbDEdProducto.Selected.PRODUCTO_TERMINADO_CODIGO },
                                        If( StartsWith(cod, "5T201") Or StartsWith(cod, "5T202"), "ALMACÉN P11 — EXTRUSIÓN",
                                            StartsWith(cod, "5T203"), "ALMACÉN P12 — TERMOFORMADO",
                                            StartsWith(cod, "5T204"), "ALMACÉN P13 — EXPANDIDO",
                                            StartsWith(cod, "5T205"), "ALMACÉN P14 — INYECCIÓN",
                                            StartsWith(cod, "5T206"), "ALMACÉN P15 — RAFIA",
                                            "SIN ALMACÉN ASIGNADO" ) ) );

                                Set( gClaveNueva,
                                    gTicketSel.PEDIDO_NUMERO & "-" &
                                    Switch( gAlmacenNuevo,
                                        "ALMACÉN P11 — EXTRUSIÓN",    "P11",
                                        "ALMACÉN P12 — TERMOFORMADO", "P12",
                                        "ALMACÉN P13 — EXPANDIDO",    "P13",
                                        "ALMACÉN P14 — INYECCIÓN",    "P14",
                                        "ALMACÉN P15 — RAFIA",        "P15",
                                        "SIN" ) );

                                Set( gMsgEd,
                                    If( IsBlank( cmbDEdProducto.Selected ), "Falta elegir el producto",
                                        CountRows( Filter( colTicketLineas, PRODUCTO_TERMINADO_CODIGO = cmbDEdProducto.Selected.PRODUCTO_TERMINADO_CODIGO ) ) > 0,
                                            "Ese producto ya está en el pedido: cambiá la cantidad en su línea",
                                        CountRows( Filter( colLineasActivas, PROFORMA_CLAVE = gClaveNueva ) ) > 0,
                                            "El " & gAlmacenNuevo & " ya tiene notas de venta: no se le pueden agregar productos",
                                        Value( txtDEdNuevaCant.Text ) < 1, "La cantidad tiene que ser 1 o más",
                                        gUnidadNueva = "PZA" And Value( txtDEdNuevaCant.Text ) <> RoundDown( Value( txtDEdNuevaCant.Text ), 0 ),
                                            "Las piezas se venden enteras: la cantidad no puede tener decimales",
                                        Value( txtDEdNuevoPrecio.Text ) <= 0, "El precio unitario tiene que ser mayor a cero",
                                        "" ) );

                                If( gMsgEd <> "",
                                    Notify( gMsgEd, NotificationType.Error ),
                                    With( { p: cmbDEdProducto.Selected, cod: cmbDEdProducto.Selected.PRODUCTO_TERMINADO_CODIGO },
                                        Collect( colTicketLineas, {
                                            PRODUCTO_DESCRIPCION: p.PRODUCTO_DESCRIPCION,
                                            PEDIDO_NUMERO: gTicketSel.PEDIDO_NUMERO,
                                            PRODUCTO_TERMINADO_CODIGO: cod,
                                            LINEA_ALMACEN: gAlmacenNuevo,
                                            PROFORMA_CLAVE: gClaveNueva,
                                            LINEA_CANTIDAD: Value( txtDEdNuevaCant.Text ),
                                            LINEA_PRECIO_UNITARIO: Value( txtDEdNuevoPrecio.Text ),
                                            PRODUCTO_UNIDAD: p.PRODUCTO_UNIDAD,
                                            PRODUCTO_MICRONAJE: p.PRODUCTO_MICRONAJE,
                                            PRODUCTO_PESO_PROMEDIO: p.PRODUCTO_PESO_PROMEDIO,
                                            PRODUCTO_BOLSAS_POR_PAQUETE: p.PRODUCTO_BOLSAS_POR_PAQUETE,
                                            PRODUCTO_PAQUETES_POR_JABA: p.PRODUCTO_PAQUETES_POR_JABA,
                                            PRODUCTO_JABITAS_POR_JABA: p.PRODUCTO_JABITAS_POR_JABA,
                                            PRODUCTO_JABAS_POR_BULTO: p.PRODUCTO_JABAS_POR_BULTO,
                                            PRODUCTO_PESO_POR_BOLSA: p.PRODUCTO_PESO_POR_BOLSA,
                                            PRODUCTO_PESO_POR_BULTO: p.PRODUCTO_PESO_POR_BULTO,
                                            PRODUCTO_PESO_POR_PAQUETE: p.PRODUCTO_PESO_POR_PAQUETE,
                                            PRODUCTO_PESO_POR_JABA: p.PRODUCTO_PESO_POR_JABA
                                        } )
                                    );
                                    Reset( cmbDEdProducto ); Reset( txtDEdNuevaCant ); Reset( txtDEdNuevoPrecio )
                                )
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              Size: =12
                              Text: ="+ Agregar al pedido"
                              Width: =Parent.Width - 24
                              X: =12
                              Y: =txtDEdNuevaCant.Y + txtDEdNuevaCant.Height + 8
                        - lblDEdTotal:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =gNavy
                              Fill: =gAzulBg
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              PaddingBottom: =8
                              PaddingLeft: =10
