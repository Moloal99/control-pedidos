                        - lblDNotaAnularTit:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =gRojo
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              Size: =11
                              Text: ="ANULAR NOTA " & gNvNro
                              Width: =Parent.Width - 24
                              Y: =galDNotaNotas.Y + galDNotaNotas.Height + 12
                        - txtDNotaMotivo:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Default: =
                              Font: =Font.'Open Sans'
                              HintText: ="Motivo de la anulación (obligatorio)"
                              HoverBorderColor: =RGBA(0, 18, 107, 1)
                              HoverFill: =RGBA(186, 202, 226, 1)
                              Mode: =TextMode.MultiLine
                              Size: =12
                              Width: =Parent.Width - 24
                              Y: =lblDNotaAnularTit.Y + lblDNotaAnularTit.Height + 4
                        - btnDNotaAnularConf:
                            Control: Classic/Button@2.2.0
                            Properties:
                              AutoDisableOnSelect: =false
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              Color: =Color.White
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              Fill: =gRojo
                              Font: =Font.'Open Sans'
                              Height: =40
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              OnSelect: |-
                                =If(
                                    IsBlank( Trim( txtDNotaMotivo.Text ) ),
                                    Notify( "Escribí el motivo de la anulación", NotificationType.Error ),

                                    Len( Trim( txtDNotaMotivo.Text ) ) < 10,
                                    Notify( "El motivo tiene que ser más específico (al menos 10 caracteres)", NotificationType.Error ),

                                    /* ---------------- ANULACIÓN ---------------- */
                                    Set( gAnulOk, false );

                                    IfError(
                                        Patch( fact_NOTAS_VENTA, LookUp( fact_NOTAS_VENTA, ID = gNvAnularId ),
                                            {
                                                NOTA_ANULADA:        true,
                                                NOTA_ANULADA_MOTIVO: Trim( txtDNotaMotivo.Text ),
                                                NOTA_ANULADA_POR:    gUsuario,
                                                NOTA_ANULADA_FECHA:  Now()
                                            }
                                        );
                                        Set( gAnulOk, true ),
                                        Notify( "No se pudo anular: " & FirstError.Message, NotificationType.Error )
                                    );

                                    If(
                                        Not( gAnulOk ),
                                        Notify( "No llegó la respuesta del servidor. Puede que el cambio SÍ se haya guardado. " &
                                                "Salí y volvé a entrar a esta pantalla para verificar antes de reintentar.",
                                                NotificationType.Error ),

                                        /* ---------- Memoria ---------- */
                                        Patch( colTicketNotas, LookUp( colTicketNotas, ID = gNvAnularId ),
                                            {
                                                NOTA_ANULADA:        true,
                                                NOTA_ANULADA_MOTIVO: Trim( txtDNotaMotivo.Text ),
                                                NOTA_ANULADA_POR:    gUsuario,
                                                NOTA_ANULADA_FECHA:  Now()
                                            }
                                        );

                                        RemoveIf( colTicketNotaLineas, NOTA_NUMERO = gNvNro );

                                        ClearCollect( colProfLineas,
                                            ForAll( Filter( colTicketLineas, PROFORMA_CLAVE = gNvClave ) As pl,
                                                With(
                                                    { desp: Sum( Filter( colTicketNotaLineas,
                                                                    PROFORMA_CLAVE = pl.PROFORMA_CLAVE And
                                                                    PRODUCTO_TERMINADO_CODIGO = pl.PRODUCTO_TERMINADO_CODIGO ),
                                                                 LINEA_CANTIDAD ) },
                                                    {
                                                        ID:                        pl.ID,
                                                        PRODUCTO_TERMINADO_CODIGO: pl.PRODUCTO_TERMINADO_CODIGO,
                                                        PRODUCTO_DESCRIPCION:      pl.PRODUCTO_DESCRIPCION,
                                                        PRODUCTO_UNIDAD:           pl.PRODUCTO_UNIDAD,
                                                        PRODUCTO_PESO_PROMEDIO:    Coalesce( pl.PRODUCTO_PESO_PROMEDIO, 0 ),
                                                        LINEA_ALMACEN:             pl.LINEA_ALMACEN,
                                                        PROFORMA_CLAVE:            pl.PROFORMA_CLAVE,
                                                        LINEA_CANTIDAD:            pl.LINEA_CANTIDAD,
                                                        LINEA_PRECIO_UNITARIO:     Coalesce( pl.LINEA_PRECIO_UNITARIO, 0 ),
                                                        Despachado:                desp,
                                                        Pendiente:                 pl.LINEA_CANTIDAD - desp,
                                                        ADespachar:                0
                                                    }
                                                )
                                            )
                                        );

                                        ClearCollect( colProfNotas,
                                            Filter( colTicketNotas, PROFORMA_CLAVE = gNvClave ) );

                                        ClearCollect( colProfNotaLineas,
                                            Filter( colTicketNotaLineas, PROFORMA_CLAVE = gNvClave ) );

                                        Set( gMaxLineasNota,
                                            Coalesce(
                                                Max(
                                                    ForAll( colProfNotas As n,
                                                        CountRows( Filter( colProfNotaLineas, NOTA_NUMERO = n.NOTA_NUMERO ) ) ),
                                                    Value
                                                ),
                                                1
                                            )
                                        );

                                        /* ---------- Estado del pedido ---------- */
                                        With(
                                            { desp: Sum( colTicketNotaLineas, LINEA_CANTIDAD ),
                                              tot:  Sum( colTicketLineas,     LINEA_CANTIDAD ) },
                                            With(
                                                { est: If( desp >= tot, "Despachado total",
                                                           desp > 0,    "Despachado parcial",
                                                           CountRows( Filter( colTicketProformas,
                                                               Not( IsBlank( PROFORMA_NUMERO ) ) ) ) > 0, "Proformado",
                                                           "Sin proforma" ) },
                                                If(
                                                    Coalesce( gTicketSel.PEDIDO_ESTADO_DESPACHO.Value, "" ) <> est,
                                                    IfError(
                                                        Patch( fact_PEDIDOS, LookUp( fact_PEDIDOS, ID = gTicketSel.ID ),
                                                            { PEDIDO_ESTADO_DESPACHO: { Value: est } } ); false,
                                                        Notify( "El estado del pedido no se pudo actualizar", NotificationType.Warning )
                                                    );
                                                    Set( gTicketSel, Patch( gTicketSel, { PEDIDO_ESTADO_DESPACHO: { Value: est } } ) )
                                                )
                                            )
                                        );

                                        /* ---------- Destinatarios: fijos + rol almacén + los 5 encargados ----------
                                           Las tres direcciones viven en App.OnStart.
                                           El Filter descarta las partes vacías, así no quedan ";;" sueltos. */
                                        Set( gMailAlmacen,
                                            With(
                                                { enc: Concat( Filter( colMailEncargados, Not( IsBlank( Trim( MAIL ) ) ) ),
                                                               Trim( MAIL ), ";" ) },
                                                Concat(
                                                    Filter(
                                                        Table(
                                                            { m: gMailAnulacionFijos },
                                                            { m: gMailRolAlmacen },
                                                            { m: enc }
                                                        ),
                                                        Not( IsBlank( Trim( m ) ) )
                                                    ),
                                                    Trim( m ), ";"
                                                )
                                            )
                                        );

                                        /* ---------- Aviso ---------- */
                                        With(
                                            { mails:
                                                Concat(
                                                    Filter(
                                                        Table(
                                                            { m: Coalesce( LookUp( dim_VENDEDORES,
                                                                    VENDEDOR_CODIGO = gTicketSel.VENDEDOR_CODIGO ).VENDEDOR_EMAIL, "" ) },
                                                            { m: User().Email },
                                                            { m: "samuel.jara@analytico.com.py" },
                                                            { m: Coalesce( gMailAlmacen, "" ) }
                                                        ),
                                                        Not( IsBlank( Trim( m ) ) )
                                                    ),
                                                    Trim( m ), ";"
                                                )
                                            },

                                            IfError(
                                                Office365Outlook.SendEmailV2(
                                                    mails,
                                                    "Nota de venta anulada · " & gNvNro & " · " & gTicketSel.CLIENTE_NOMBRE,

                                                    "<div style=""font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#1F2937"">" &
                                                    "<h2 style=""color:#E30613;margin:0 0 12px"">Nota de venta anulada</h2>" &
                                                    "<p><b>Nota:</b> " & gNvNro & "<br>" &
                                                    "<b>Pedido:</b> " & gTicketSel.PEDIDO_NUMERO & "<br>" &
                                                    "<b>Cliente:</b> " & gTicketSel.CLIENTE_NOMBRE & "<br>" &
                                                    "<b>Almacén:</b> " & gProfSel.PROFORMA_ALMACEN & "</p>" &
                                                    "<div style=""background:#FEF2F2;border-left:4px solid #E30613;padding:12px 16px;margin:12px 0"">" &
                                                    "<b>Motivo:</b><br>" & Trim( txtDNotaMotivo.Text ) & "</div>" &
                                                    "<p>Anulada por <b>" & gUsuario & "</b> el " &
                                                        Text( Now(), "dd/mm/yyyy hh:mm" ) & ".</p>" &
                                                    "<p style=""color:#6B7280;font-size:12px"">Las cantidades volvieron a quedar " &
                                                    "pendientes de despacho.</p>" &
                                                    "</div>"
                                                ); false,

                                                Notify( "La nota se anuló pero el correo NO se envió a: " & mails &
                                                        ". Avisales a mano.", NotificationType.Warning )
                                            )
                                        );

                                        Set( gNvAnularId, 0 );
                                        Reset( txtDNotaMotivo );
                                        Notify( "Nota " & gNvNro & " anulada", NotificationType.Success )
                                    )
                                )
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              Size: =12
                              Text: ="Confirmar anulación"
                              Width: =( Parent.Width - 32 ) * 0.62
                              X: =12
                              Y: =txtDNotaMotivo.Y + txtDNotaMotivo.Height + 8
                        - btnDNotaAnularCancel:
                            Control: Classic/Button@2.2.0
                            Properties:
                              AutoDisableOnSelect: =false
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              Color: =gTexto
