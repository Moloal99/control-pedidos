                        - btnDCobNroGuardar:
                            Control: Classic/Button@2.2.0
                            Properties:
                              AutoDisableOnSelect: =false
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              Color: =Color.White
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              Fill: =gVerde
                              Font: =Font.'Open Sans'
                              Height: =40
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              OnSelect: |-
                                =With(
                                    { nuevo: Trim( txtDCobNroNuevo.Text ),
                                      antes: Coalesce( gCobranzaSel.COBRANZA_NUMERO, "" ),
                                      motivo: Trim( txtDCobNroMotivo.Text ) },

                                    If(
                                        IsBlank( gCobranzaSel ),
                                        Notify( "Seleccioná una cobranza", NotificationType.Error ),

                                        IsBlank( nuevo ),
                                        Notify( "Escribí el número correcto", NotificationType.Error ),

                                        nuevo = antes,
                                        Notify( "El número nuevo es igual al actual", NotificationType.Error ),

                                        Not( IsBlank( LookUp( fact_COBRANZAS, COBRANZA_NUMERO = nuevo ) ) ),
                                        Notify( "Ya existe otra cobranza con ese número", NotificationType.Error ),

                                        IsBlank( motivo ),
                                        Notify( "Escribí el motivo de la corrección", NotificationType.Error ),

                                        Len( motivo ) < 10,
                                        Notify( "El motivo tiene que ser más específico (al menos 10 caracteres)", NotificationType.Error ),

                                        Set( gCbrNroOk, false );

                                        IfError(
                                            Patch( fact_COBRANZAS, LookUp( fact_COBRANZAS, ID = gCobranzaSel.ID ),
                                                {
                                                    COBRANZA_NUMERO:             nuevo,
                                                    COBRANZA_NUMERO_ANTERIOR:    antes,
                                                    COBRANZA_NUMERO_MOTIVO:      motivo,
                                                    COBRANZA_NUMERO_MODIF_POR:   gUsuario,
                                                    COBRANZA_FECHA_MODIF_NUMERO: Now()
                                                }
                                            );
                                            Set( gCbrNroOk, true ),
                                            Notify( "No se pudo corregir: " & FirstError.Message, NotificationType.Error )
                                        );

                                        If( Not( gCbrNroOk ),
                                            Notify( "El número no se corrigió. Nada cambió.", NotificationType.Error ),

                                            Set( gCobranzaSel, LookUp( fact_COBRANZAS, ID = gCobranzaSel.ID ) );

                                            With(
                                                { mails:
                                                    Concat(
                                                        Filter(
                                                            Table(
                                                                { m: Coalesce( LookUp( dim_VENDEDORES,
                                                                        VENDEDOR_CODIGO = gCobranzaSel.VENDEDOR_CODIGO ).VENDEDOR_EMAIL, "" ) },
                                                                { m: User().Email },
                                                                { m: "samuel.jara@analytico.com.py" }
                                                            ),
                                                            Not( IsBlank( Trim( m ) ) )
                                                        ),
                                                        Trim( m ), ";"
                                                    )
                                                },
                                                IfError(
                                                    Office365Outlook.SendEmailV2(
                                                        mails,
                                                        "Corrección de N° de cobranza · Nota " & gCobranzaSel.NOTA_NUMERO &
                                                            " · " & gCobranzaSel.CLIENTE_NOMBRE,
                                                        "<div style=""font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#1F2937;max-width:620px"">" &
                                                        "<div style=""background:#0B2E59;color:#FFFFFF;padding:16px 22px;border-radius:8px 8px 0 0"">" &
                                                            "<div style=""font-size:12px;letter-spacing:1px;opacity:.85"">PLÁSTICOS CARMEN</div>" &
                                                            "<div style=""font-size:20px;font-weight:700;margin-top:4px"">Corrección de número de cobranza</div>" &
                                                        "</div>" &
                                                        "<div style=""border:1px solid #E5E7EB;border-top:0;border-radius:0 0 8px 8px;padding:18px 22px"">" &

                                                        "<div style=""background:#FDF3E3;border-left:4px solid #C98A00;padding:12px 16px;margin-bottom:16px"">" &
                                                            "<div style=""font-size:12px;color:#6B7280;margin-bottom:4px"">NÚMERO DE COBRANZA</div>" &
                                                            "<span style=""color:#9CA3AF;text-decoration:line-through;font-size:16px"">" & antes & "</span>" &
                                                            " &nbsp;&rarr;&nbsp; <b style=""color:#0B2E59;font-size:18px"">" & nuevo & "</b>" &
                                                        "</div>" &

                                                        "<table style=""width:100%;border-collapse:collapse;font-size:14px"">" &
                                                            "<tr><td style=""padding:7px 0;color:#6B7280;width:38%"">Nota de venta</td>" &
                                                                "<td style=""padding:7px 0""><b>" & gCobranzaSel.NOTA_NUMERO & "</b></td></tr>" &
                                                            "<tr><td style=""padding:7px 0;color:#6B7280;border-top:1px solid #F0F0F0"">Cliente</td>" &
                                                                "<td style=""padding:7px 0;border-top:1px solid #F0F0F0"">" & gCobranzaSel.CLIENTE_NOMBRE & "</td></tr>" &
                                                            "<tr><td style=""padding:7px 0;color:#6B7280;border-top:1px solid #F0F0F0"">Monto</td>" &
                                                                "<td style=""padding:7px 0;border-top:1px solid #F0F0F0"">Bs " &
                                                                Text( gCobranzaSel.COBRANZA_MONTO, "#,##0.00" ) & "</td></tr>" &
                                                            "<tr><td style=""padding:7px 0;color:#6B7280;border-top:1px solid #F0F0F0"">Vendedor</td>" &
                                                                "<td style=""padding:7px 0;border-top:1px solid #F0F0F0"">" & gCobranzaSel.VENDEDOR_NOMBRE & "</td></tr>" &
                                                        "</table>" &

                                                        "<div style=""margin-top:16px;background:#F3F6FB;padding:12px 16px;border-radius:6px"">" &
                                                            "<div style=""font-size:12px;color:#6B7280;margin-bottom:4px"">JUSTIFICATIVO</div>" &
                                                            motivo &
                                                        "</div>" &

                                                        "<p style=""margin-top:16px;color:#6B7280;font-size:12px"">Corregido por <b>" & gUsuario &
                                                            "</b> el " & Text( Now(), "dd/mm/yyyy hh:mm" ) & ". El monto y el saldo de la nota no cambiaron.</p>" &
                                                        "</div></div>"
                                                    ); false,
                                                    Notify( "El número se corrigió pero el correo no se envió.", NotificationType.Warning )
                                                )
                                            );

                                            Set( gCbrEditNro, false );
                                            Reset( txtDCobNroNuevo );
                                            Reset( txtDCobNroMotivo );
                                            Notify( "Número corregido: " & antes & " → " & nuevo, NotificationType.Success )
                                        )
                                    )
                                )
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              Size: =12
                              Text: ="Guardar corrección"
                              Visible: =gCbrEditNro
                              Width: =(Parent.Width - 28) / 2
                              X: =12
                              Y: =txtDCobNroMotivo.Y + txtDCobNroMotivo.Height + 8
                        - btnDCobNroCancelar:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =gLinea
                              BorderThickness: =1
                              Color: =gTextoSec
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              Fill: =Color.White
                              Font: =Font.'Open Sans'
                              Height: =40
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              OnSelect: =Set( gCbrEditNro, false ); Reset( txtDCobNroNuevo ); Reset( txtDCobNroMotivo )
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              Size: =12
                              Text: ="Cancelar"
                              Visible: =gCbrEditNro
                              Width: =(Parent.Width - 28) / 2
                              X: =btnDCobNroGuardar.X + btnDCobNroGuardar.Width + 4
                              Y: =btnDCobNroGuardar.Y
            - btnDetallesGuardar:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =If( gModoEdicion, gVerde, gNavy )
                  Font: =Font.'Segoe UI'
                  Height: =56
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: "=If( Not(gModoEdicion),\n\n    ClearCollect( colTicketLineas, Filter( fact_PEDIDO_LINEAS, PEDIDO_NUMERO = gTicketSel.PEDIDO_NUMERO ) );\n    ClearCollect( colTicketBorradas, FirstN( colTicketLineas, 0 ) );\n    ClearCollect( colTicketProformas, Filter( fact_PROFORMAS, PEDIDO_NUMERO = gTicketSel.PEDIDO_NUMERO ) );\n    Reset( cmbDEdFormaPago ); Reset( txtDEdDias ); Reset( txtDEdProforma );\n    Set( gModoEdicion, true ),\n\n    Set( gEdFormaPago, cmbDEdFormaPago.Selected.Value );\n    Set( gEdDias, If( gEdFormaPago = \"Crédito\", Value( txtDEdDias.Text ), 0 ) );\n    Set( gEdTotal, Sum( colTicketLineas, LINEA_CANTIDAD * LINEA_PRECIO_UNITARIO ) );\n    Set( gEdPagado, Coalesce( gTicketSel.PEDIDO_TOTAL_PAGADO, 0 ) );\n\n    Set( gMsgGuardar,\n        If( CountRows( colTicketLineas ) = 0, \"El pedido tiene que tener al menos un producto\",\n            CountRows( Filter( colTicketLineas, LINEA_CANTIDAD < 1 ) ) > 0, \"Hay productos con cantidad menor a 1\",\n            CountRows( Filter( colTicketLineas, Upper( Trim( PRODUCTO_UNIDAD ) ) = \"PZA\" And LINEA_CANTIDAD <> RoundDown( LINEA_CANTIDAD, 0 ) ) ) > 0,\n                \"Las piezas se venden enteras: hay una cantidad con decimales\",\n            CountRows( Filter( colTicketLineas, LINEA_PRECIO_UNITARIO <= 0 ) ) > 0, \"Hay productos con precio cero o vacío\",\n            IsBlank( gEdFormaPago ), \"Falta la forma de pago\",\n            gEdFormaPago = \"Crédito\" And gEdDias < 1, \"Los días de crédito tienen que ser 1 o más\",\n            \"\" ) );\n\n    If( gMsgGuardar <> \"\",\n        Notify( gMsgGuardar, NotificationType.Error ),\n\n        Set( gTicketAntes, gTicketSel );\n        ClearCollect( colLineasAntes, Filter( fact_PEDIDO_LINEAS, PEDIDO_NUMERO = gTicketSel.PEDIDO_NUMERO ) );\n\n        Set( gHuboCambiosPedido,\n            gTicketAntes.PEDIDO_FORMA_PAGO.Value <> gEdFormaPago\n            Or Coalesce( gTicketAntes.PEDIDO_DIAS_CREDITO, 0 ) <> gEdDias\n            Or CountRows( colTicketBorradas ) > 0\n            Or CountRows( Filter( colTicketLineas, IsBlank( ID ) ) ) > 0\n            Or CountRows( Filter( colTicketLineas As l,\n                    Not( IsBlank( l.ID ) ) And (\n                        l.LINEA_CANTIDAD <> LookUp( colLineasAntes, ID = l.ID ).LINEA_CANTIDAD\n                        Or l.LINEA_PRECIO_UNITARIO <> LookUp( colLineasAntes, ID = l.ID ).LINEA_PRECIO_UNITARIO ) ) ) > 0\n        );\n\n        Patch( fact_PEDIDOS, gTicketSel, {\n            PEDIDO_FORMA_PAGO: { Value: gEdFormaPago },\n            PEDIDO_DIAS_CREDITO: gEdDias,\n            PEDIDO_FECHA_VENCIMIENTO: DateAdd( gTicketSel.PEDIDO_FECHA, gEdDias, TimeUnit.Days ),\n            PEDIDO_TOTAL: gEdTotal,\n            PEDIDO_SALDO_PENDIENTE: gEdTotal - gEdPagado,\n            PEDIDO_ESTADO_PAGO: { Value:\n                If( gEdTotal - gEdPagado <= 0, \"Pagado\",\n                    gEdPagado > 0,             \"Parcial\",\n                                               \"Pendiente\" ) },\n            PEDIDO_MODIFICADO_POR: gUsuario,\n            PEDIDO_FECHA_MODIFICACION: Now()\n        } );\n        Set( gCabEdOk, IsEmpty( Errors( fact_PEDIDOS ) ) );\n\n        If( gCabEdOk,\n            ForAll( colTicketBorradas As b,\n                Remove( fact_PEDIDO_LINEAS, LookUp( fact_PEDIDO_LINEAS, ID = b.ID ) ) );\n            ForAll( Filter( colTicketLineas, Not( IsBlank( ID ) ) ) As l,\n                Patch( fact_PEDIDO_LINEAS, LookUp( fact_PEDIDO_LINEAS, ID = l.ID ), {\n                    LINEA_CANTIDAD: l.LINEA_CANTIDAD,\n                    LINEA_PRECIO_UNITARIO: l.LINEA_PRECIO_UNITARIO\n                } ) );\n            ForAll( Filter( colTicketLineas, IsBlank( ID ) ) As n,\n                With( { prod: LookUp( dim_PRODUCTOS, PRODUCTO_TERMINADO_CODIGO = n.PRODUCTO_TERMINADO_CODIGO ) },\n                    Patch( fact_PEDIDO_LINEAS, Defaults( fact_PEDIDO_LINEAS ), {\n                        PRODUCTO_DESCRIPCION: n.PRODUCTO_DESCRIPCION,\n                        PEDIDO_NUMERO: n.PEDIDO_NUMERO,\n                        dim_PRODUCTOS_ID: {\n                            '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference\",\n                            Id: prod.ID,\n                            Value: prod.PRODUCTO_DESCRIPCION\n                        },\n                        PRODUCTO_TERMINADO_CODIGO: n.PRODUCTO_TERMINADO_CODIGO,\n                        LINEA_ALMACEN: n.LINEA_ALMACEN,\n                        PROFORMA_CLAVE: gTicketSel.PEDIDO_NUMERO & \"-\" &\n                            Switch( n.LINEA_ALMACEN,\n                                \"ALMACÉN P11 — EXTRUSIÓN\",    \"P11\",\n                                \"ALMACÉN P12 — TERMOFORMADO\", \"P12\",\n                                \"ALMACÉN P13 — EXPANDIDO\",    \"P13\",\n                                \"ALMACÉN P14 — INYECCIÓN\",    \"P14\",\n                                \"ALMACÉN P15 — RAFIA\",        \"P15\",\n                                \"SIN\" ),\n                        LINEA_CANTIDAD_DESPACHADA: 0,\n                        LINEA_CANTIDAD: n.LINEA_CANTIDAD,\n                        LINEA_PRECIO_UNITARIO: n.LINEA_PRECIO_UNITARIO,\n                        PRODUCTO_UNIDAD: n.PRODUCTO_UNIDAD,\n                        PRODUCTO_MICRONAJE: n.PRODUCTO_MICRONAJE,\n                        PRODUCTO_PESO_PROMEDIO: n.PRODUCTO_PESO_PROMEDIO,\n                        PRODUCTO_BOLSAS_POR_PAQUETE: n.PRODUCTO_BOLSAS_POR_PAQUETE,\n                        PRODUCTO_PAQUETES_POR_JABA: n.PRODUCTO_PAQUETES_POR_JABA,\n                        PRODUCTO_JABITAS_POR_JABA: n.PRODUCTO_JABITAS_POR_JABA,\n                        PRODUCTO_JABAS_POR_BULTO: n.PRODUCTO_JABAS_POR_BULTO,\n                        PRODUCTO_PESO_POR_BOLSA: n.PRODUCTO_PESO_POR_BOLSA,\n                        PRODUCTO_PESO_POR_BULTO: n.PRODUCTO_PESO_POR_BULTO,\n                        PRODUCTO_PESO_POR_PAQUETE: n.PRODUCTO_PESO_POR_PAQUETE,\n                        PRODUCTO_PESO_POR_JABA: n.PRODUCTO_PESO_POR_JABA\n                    } ) ) )\n        );\n        Set( gLinEdOk, IsEmpty( Errors( fact_PEDIDO_LINEAS ) ) );\n\n        If( gCabEdOk And gLinEdOk,\n\n            Set( gTicketSel, LookUp( fact_PEDIDOS, ID = gTicketSel.ID ) );\n            ClearCollect( colTicketLineas, Filter( fact_PEDIDO_LINEAS, PEDIDO_NUMERO = gTicketSel.PEDIDO_NUMERO ) );\n\n            ForAll( Distinct( colTicketLineas, PROFORMA_CLAVE ) As pc,\n                With( {\n                    prof: LookUp( fact_PROFORMAS, PROFORMA_CLAVE = pc.Value ),\n                    tot:  Sum( Filter( colTicketLineas, PROFORMA_CLAVE = pc.Value ), LINEA_CANTIDAD * LINEA_PRECIO_UNITARIO ),\n                    alm:  First( Filter( colTicketLineas, PROFORMA_CLAVE = pc.Value ) ).LINEA_ALMACEN\n                },\n                    If( IsBlank( prof ),\n                        Patch( fact_PROFORMAS, Defaults( fact_PROFORMAS ), {\n                            PROFORMA_TITULO: pc.Value,\n                            PROFORMA_CLAVE: pc.Value,\n                            PEDIDO_NUMERO: gTicketSel.PEDIDO_NUMERO,\n                            dim_CLIENTES_ID: {\n                                '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference\",\n                                Id: LookUp( dim_CLIENTES, CLIENTE_CODIGO = gTicketSel.CLIENTE_CODIGO ).ID,\n                                Value: gTicketSel.CLIENTE_NOMBRE\n                            },\n                            CLIENTE_CODIGO: gTicketSel.CLIENTE_CODIGO,\n                            CLIENTE_NOMBRE: gTicketSel.CLIENTE_NOMBRE,\n                            VENDEDOR_CODIGO: gTicketSel.VENDEDOR_CODIGO,\n                            VENDEDOR_NOMBRE: gTicketSel.VENDEDOR_NOMBRE,\n                            PROFORMA_ALMACEN: alm,\n                            PROFORMA_FECHA: Now(),\n                            PROFORMA_TOTAL: tot,\n                            PROFORMA_TOTAL_DESPACHADO: 0,\n                            PROFORMA_ESTADO: { Value: \"Sin número\" }\n                        } ),\n                        Patch( fact_PROFORMAS, prof, { PROFORMA_TOTAL: tot } )\n                    )\n                )\n            );\n\n            ClearCollect( colProfBorrar,\n                Filter(\n                    Filter( fact_PROFORMAS, PEDIDO_NUMERO = gTicketSel.PEDIDO_NUMERO ) As pr,\n                    IsBlank( pr.PROFORMA_NUMERO )\n                    And CountRows( Filter( colTicketLineas, PROFORMA_CLAVE = pr.PROFORMA_CLAVE ) ) = 0\n                ) );\n            ForAll( colProfBorrar As b,\n                Remove( fact_PROFORMAS, LookUp( fact_PROFORMAS, ID = b.ID ) ) );\n\n            ClearCollect( colTicketProformas, Filter( fact_PROFORMAS, PEDIDO_NUMERO = gTicketSel.PEDIDO_NUMERO ) );\n            /* Editable mientras la proforma NO tenga notas de venta activas.\n               Tener numero ya no bloquea. */\n            Set( gProductosEditables,\n                CountRows(\n                    Filter( colTicketProformas As p,\n                        CountRows( Filter( colLineasActivas, PROFORMA_CLAVE = p.PROFORMA_CLAVE ) ) > 0 )\n                ) = 0 );\n\n            If( gHuboCambiosPedido,\n\n                Set( gEdCli, LookUp( dim_CLIENTES, CLIENTE_CODIGO = gTicketSel.CLIENTE_CODIGO ) );\n                Set( gEdVenceAntes, gTicketAntes.PEDIDO_FECHA_VENCIMIENTO );\n                Set( gEdVenceAhora, DateAdd( gTicketSel.PEDIDO_FECHA, gEdDias, TimeUnit.Days ) );\n                Set( gEdProdAntes, CountRows( colLineasAntes ) );\n                Set( gEdProdAhora, CountRows( colTicketLineas ) );\n                Set( gEdTotalAntes, Coalesce( gTicketAntes.PEDIDO_TOTAL, 0 ) );\n\n                Set( gCabCambio,\n                    gTicketAntes.PEDIDO_FORMA_PAGO.Value <> gEdFormaPago\n                    Or Coalesce( gTicketAntes.PEDIDO_DIAS_CREDITO, 0 ) <> gEdDias );\n\n                Set( gMailVendEmail,\n                    Coalesce( LookUp( dim_VENDEDORES, VENDEDOR_CODIGO = gTicketSel.VENDEDOR_CODIGO ).VENDEDOR_EMAIL, \"\" ) );\n\n                ClearCollect( colMailProf, Distinct( colTicketLineas, PROFORMA_CLAVE ) );\n                Collect( colMailProf, Distinct( colTicketBorradas, PROFORMA_CLAVE ) );\n                ClearCollect( colMailProfOrd, Sort( Distinct( colMailProf, Value ), Value ) );\n\n                ClearCollect( colMailEnvios,\n                    ForAll( colMailProfOrd As a,\n                        {\n                            Clave: a.Value,\n                            Alm: Coalesce(\n                                    First( Filter( colTicketLineas,   PROFORMA_CLAVE = a.Value ) ).LINEA_ALMACEN,\n                                    First( Filter( colTicketBorradas, PROFORMA_CLAVE = a.Value ) ).LINEA_ALMACEN,\n                                    \"SIN ALMACÉN ASIGNADO\" ),\n                            Nro: Coalesce( LookUp( colTicketProformas, PROFORMA_CLAVE = a.Value ).PROFORMA_NUMERO, \"\" ),\n                            TotAhora: Sum( Filter( colTicketLineas, PROFORMA_CLAVE = a.Value ), LINEA_CANTIDAD * LINEA_PRECIO_UNITARIO ),\n                            TotAntes: Sum( Filter( colLineasAntes,  PROFORMA_CLAVE = a.Value ), LINEA_CANTIDAD * LINEA_PRECIO_UNITARIO ),\n                            Kg:       Sum( Filter( colTicketLineas, PROFORMA_CLAVE = a.Value ), LINEA_CANTIDAD * Coalesce( PRODUCTO_PESO_PROMEDIO, 0 ) ),\n                            NNuevos:  CountRows( Filter( colTicketLineas As q,\n                                          q.PROFORMA_CLAVE = a.Value And IsBlank( LookUp( colLineasAntes, ID = q.ID ) ) ) ),\n                            NModif:   CountRows( Filter( colTicketLineas As q,\n                                          q.PROFORMA_CLAVE = a.Value\n                                          And Not( IsBlank( LookUp( colLineasAntes, ID = q.ID ) ) )\n                                          And ( LookUp( colLineasAntes, ID = q.ID ).LINEA_CANTIDAD <> q.LINEA_CANTIDAD\n                                                Or LookUp( colLineasAntes, ID = q.ID ).LINEA_PRECIO_UNITARIO <> q.LINEA_PRECIO_UNITARIO ) ) ),\n                            NElim:    CountRows( Filter( colTicketBorradas, PROFORMA_CLAVE = a.Value ) )\n                        } ) );\n                \n                ForAll( Filter( colMailEnvios, NNuevos + NModif + NElim > 0 Or gCabCambio ) As e,\n                    With(\n                        {\n                            dest:\n                                Trim( If( Not( IsBlank( gMailRolAlmacen ) ), gMailRolAlmacen & \";\", \"\" ) &\n                                      If( gMailVendEmail <> \"\", gMailVendEmail & \";\", \"\" ) &\n                                      User().Email & \";samuel.jara@analytico.com.py\" ),\n\n                            cambios:\n                                If( gCabCambio,\n                                    If( gTicketAntes.PEDIDO_FORMA_PAGO.Value <> gEdFormaPago,\n                                        \"<li>Forma de pago: <b>\" & gTicketAntes.PEDIDO_FORMA_PAGO.Value &\n                                        \"</b> &rarr; <b>\" & gEdFormaPago & \"</b></li>\", \"\" ) &\n                                    If( Coalesce( gTicketAntes.PEDIDO_DIAS_CREDITO, 0 ) <> gEdDias,\n                                        \"<li>Días de crédito: <b>\" & Coalesce( gTicketAntes.PEDIDO_DIAS_CREDITO, 0 ) &\n                                        \"</b> &rarr; <b>\" & gEdDias & \"</b> &middot; vence \" &\n                                        Text( gEdVenceAntes, \"dd/mm/yyyy\" ) & \" &rarr; <b>\" &\n                                        Text( gEdVenceAhora, \"dd/mm/yyyy\" ) & \"</b></li>\", \"\" ),\n                                    \"\" ) &\n\n                                Concat( Filter( colTicketLineas, PROFORMA_CLAVE = e.Clave ) As p,\n                                    With( { ant: LookUp( colLineasAntes, ID = p.ID ) },\n                                        If( IsBlank( ant ),\n                                            \"<li><span style=\"\"background:#DCFCE7;color:#166534;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px\"\">NUEVO</span> <b>\" &\n                                                p.PRODUCTO_DESCRIPCION & \"</b> &mdash; \" & p.LINEA_CANTIDAD & \" \" & p.PRODUCTO_UNIDAD &\n                                                \" &times; Bs \" & Text( p.LINEA_PRECIO_UNITARIO, \"#,##0.00\" ) &\n                                                \" = <b>Bs \" & Text( p.LINEA_CANTIDAD * p.LINEA_PRECIO_UNITARIO, \"#,##0.00\" ) & \"</b></li>\",\n                                            If( ant.LINEA_CANTIDAD <> p.LINEA_CANTIDAD Or ant.LINEA_PRECIO_UNITARIO <> p.LINEA_PRECIO_UNITARIO,\n                                                \"<li><span style=\"\"background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px\"\">CAMBIO</span> <b>\" &\n                                                    p.PRODUCTO_DESCRIPCION & \"</b> &mdash; \" &\n                                                    If( ant.LINEA_CANTIDAD <> p.LINEA_CANTIDAD,\n                                                        \"cantidad <span style=\"\"color:#9CA3AF;text-decoration:line-through\"\">\" & ant.LINEA_CANTIDAD &\n                                                        \"</span> &rarr; <b>\" & p.LINEA_CANTIDAD & \"</b> \" & p.PRODUCTO_UNIDAD, \"\" ) &\n                                                    If( ant.LINEA_CANTIDAD <> p.LINEA_CANTIDAD And ant.LINEA_PRECIO_UNITARIO <> p.LINEA_PRECIO_UNITARIO,\n                                                        \" &nbsp;&middot;&nbsp; \", \"\" ) &\n                                                    If( ant.LINEA_PRECIO_UNITARIO <> p.LINEA_PRECIO_UNITARIO,\n                                                        \"precio <span style=\"\"color:#9CA3AF;text-decoration:line-through\"\">Bs \" &\n                                                        Text( ant.LINEA_PRECIO_UNITARIO, \"#,##0.00\" ) & \"</span> &rarr; <b>Bs \" &\n                                                        Text( p.LINEA_PRECIO_UNITARIO, \"#,##0.00\" ) & \"</b>\", \"\" ) &\n                                                    \" &nbsp;&middot;&nbsp; subtotal <span style=\"\"color:#9CA3AF;text-decoration:line-through\"\">Bs \" &\n                                                        Text( ant.LINEA_CANTIDAD * ant.LINEA_PRECIO_UNITARIO, \"#,##0.00\" ) & \"</span> &rarr; <b>Bs \" &\n                                                        Text( p.LINEA_CANTIDAD * p.LINEA_PRECIO_UNITARIO, \"#,##0.00\" ) & \"</b>\" &\n                                                \"</li>\",\n                                                \"\" ) ) ) ) &\n\n                                Concat( Filter( colTicketBorradas, PROFORMA_CLAVE = e.Clave ) As d,\n                                    \"<li><span style=\"\"background:#FEE2E2;color:#991B1B;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px\"\">ELIMINADO</span> <span style=\"\"text-decoration:line-through\"\">\" &\n                                        d.PRODUCTO_DESCRIPCION & \"</span> &mdash; eran \" & d.LINEA_CANTIDAD & \" \" & d.PRODUCTO_UNIDAD &\n                                        \" &times; Bs \" & Text( d.LINEA_PRECIO_UNITARIO, \"#,##0.00\" ) & \"</li>\" ),\n\n                            filas:\n                                Concat( Filter( colTicketLineas, PROFORMA_CLAVE = e.Clave ) As p,\n                                    With( { ant: LookUp( colLineasAntes, ID = p.ID ) },\n                                        \"<tr\" & If( IsBlank( ant )\n                                                    Or ant.LINEA_CANTIDAD <> p.LINEA_CANTIDAD\n                                                    Or ant.LINEA_PRECIO_UNITARIO <> p.LINEA_PRECIO_UNITARIO,\n                                                    \" style=\"\"background:#FFFBEF\"\"\", \"\" ) & \">\" &\n                                        \"<td style=\"\"padding:8px 12px;border-bottom:1px solid #F0F0F0;color:#6B7280;font-size:13px\"\">\" &\n                                            p.PRODUCTO_TERMINADO_CODIGO & \"</td>\" &\n                                        \"<td style=\"\"padding:8px 12px;border-bottom:1px solid #F0F0F0\"\">\" &\n                                            p.PRODUCTO_DESCRIPCION & \"</td>\" &\n                                        \"<td style=\"\"padding:8px 12px;border-bottom:1px solid #F0F0F0;text-align:right\"\">\" &\n                                            p.LINEA_CANTIDAD & \" \" & p.PRODUCTO_UNIDAD & \"</td>\" &\n                                        \"<td style=\"\"padding:8px 12px;border-bottom:1px solid #F0F0F0;text-align:right\"\">\" &\n                                            Text( p.LINEA_PRECIO_UNITARIO, \"#,##0.00\" ) & \"</td>\" &\n                                        \"<td style=\"\"padding:8px 12px;border-bottom:1px solid #F0F0F0;text-align:right;font-weight:700\"\">\" &\n                                            Text( p.LINEA_CANTIDAD * p.LINEA_PRECIO_UNITARIO, \"#,##0.00\" ) & \"</td>\" &\n                                        \"</tr>\" ) )\n                        },\n\n                        IfError(\n                            Office365Outlook.SendEmailV2(\n                                dest,\n                                \"Proforma modificada · \" & e.Alm &\n                                    If( e.Nro <> \"\", \" · N° \" & e.Nro, \" · sin número\" ) &\n                                    \" · \" & gTicketSel.PEDIDO_NUMERO & \" · \" & gTicketSel.CLIENTE_NOMBRE,\n\n                                \"<div style=\"\"font-family:Segoe UI,Arial,sans-serif;max-width:660px;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden\"\">\" &\n\n                                \"<div style=\"\"background:#0B2E59;color:#FFFFFF;padding:18px 24px\"\">\" &\n                                    \"<div style=\"\"font-size:12px;letter-spacing:1px;opacity:.85\"\">PLÁSTICOS CARMEN &middot; PROFORMA MODIFICADA</div>\" &\n                                    \"<div style=\"\"font-size:22px;font-weight:700;margin-top:4px\"\">\" & e.Alm & \"</div>\" &\n                                    \"<div style=\"\"font-size:14px;margin-top:2px;opacity:.9\"\">Proforma \" &\n                                        If( e.Nro <> \"\", \"<b>\" & e.Nro & \"</b>\", \"sin número\" ) &\n                                        \" &middot; pedido \" & gTicketSel.PEDIDO_NUMERO & \"</div>\" &\n                                \"</div>\" &\n\n                                \"<div style=\"\"background:#FDF3E3;border-left:4px solid #C98A00;padding:12px 20px;font-size:14px;color:#5A4300\"\">\" &\n                                    \"Modificado por <b>\" & gUsuario & \"</b> el <b>\" & Text( Now(), \"dd/mm/yyyy hh:mm\" ) & \"</b>\" &\n                                \"</div>\" &\n\n                                \"<div style=\"\"padding:20px 24px;font-size:14px;color:#1F2937\"\">\" &\n\n                                \"<div style=\"\"font-size:12px;font-weight:700;color:#6B7280;letter-spacing:.5px;margin-bottom:6px\"\">QUÉ CAMBIÓ EN ESTA PROFORMA</div>\" &\n                                \"<ul style=\"\"margin:0 0 4px 0;padding-left:20px;line-height:1.9\"\">\" & cambios & \"</ul>\" &\n                                \"<div style=\"\"margin-top:10px;padding:10px 12px;background:#F3F6FB;border-radius:6px;font-size:14px\"\">\" &\n                                    \"Subtotal de la proforma: \" &\n                                    If( e.TotAntes <> e.TotAhora,\n                                        \"<span style=\"\"color:#9CA3AF;text-decoration:line-through\"\">Bs \" & Text( e.TotAntes, \"#,##0.00\" ) &\n                                        \"</span> &rarr; <b style=\"\"color:#0B2E59\"\">Bs \" & Text( e.TotAhora, \"#,##0.00\" ) & \"</b>\",\n                                        \"<b style=\"\"color:#0B2E59\"\">Bs