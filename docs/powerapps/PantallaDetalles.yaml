                              Text: |-
                                =With( { nuevo: Sum( colTicketLineas, LINEA_CANTIDAD * LINEA_PRECIO_UNITARIO ) },
                                    "Nuevo total: Bs " & Text( nuevo, "#,##0.00" ) & Char(10) &
                                    "Pagado: Bs " & Text( gTicketSel.PEDIDO_TOTAL_PAGADO, "#,##0.00" ) &
                                    "  ·  Saldo: Bs " & Text( nuevo - gTicketSel.PEDIDO_TOTAL_PAGADO, "#,##0.00" )
                                )
                              Width: =Parent.Width - 24
                              X: =12
                              Y: =btnDEdAgregar.Y + btnDEdAgregar.Height + 10
