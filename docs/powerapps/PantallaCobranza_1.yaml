Screens:
  PantallaCobranza_1:
    Properties:
      Fill: =gFondo
      Height: =App.Height
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set( gHuboPago, false );
        Set( gTipoPago, "" );
        Set( gFormaPago, "" );
        Set( gCobranzaMonto, 0 );
        Set( gSaldoDisp, 0 );
        Clear( colCbrNotaLineas );

        ClearCollect( colCobrPend,
            ForAll(
                Filter( fact_COBRANZAS,
                    COBRANZA_HUBO_PAGO = true,
                    COBRANZA_ESTADO.Value = "Pendiente de confirmación" ) As c,
                {
                    NOTA_NUMERO:    c.NOTA_NUMERO,
                    COBRANZA_MONTO: c.COBRANZA_MONTO
                }
            )
        )
      Width: =App.Width
    Children:
      - ctnPantallaCobranza:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - cmpEncabezado_7:
                Control: CanvasComponent
                ComponentName: cmpEncabezado
                Properties:
                  Fill: =gNavy
                  Height: =56
                  Width: =Parent.Width
            - ctnPantallaCobranzaDatos:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Height: =656
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: |
                    =12
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =14
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =14
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  Width: =Parent.Width
                  Y: =56
                Children:
                  - lblCobranzaPedidosTitulo:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gTexto
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="NOTAS DE VENTA PENDIENTES  ·  " & CountRows( galCobranzaPedidos.AllItems )
                  - cardCobranzaPedidos:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =gLinea
                        BorderThickness: =1
                        Fill: =Color.White
                        FillPortions: =0
                        Height: =430
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                      Children:
                        - ctnCobranzaPedidosCuerpo:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Height: =Parent.Height
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              Width: =Parent.Width
                            Children:
                              - txtCobranzaBuscar:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Default: =""
                                    DelayOutput: =true
                                    Font: =Font.'Open Sans'
                                    Height: =40
                                    HintText: ="Buscar por nota, cliente o vendedor"
                                    HoverBorderColor: =RGBA(0, 18, 107, 1)
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    LayoutMinHeight: =40
                                    X: =40
                                    Y: =2
                              - galCobranzaPedidos:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    FillPortions: =0
                                    Height: =210
                                    Items: |-
                                      =With( { s: Trim( txtCobranzaBuscar.Text ) },
                                          SortByColumns(
                                              Filter(
                                                  If( gVeTodasLasNotas,
                                                      Filter( fact_NOTAS_VENTA, NOTA_SALDO_PENDIENTE > 0, NOTA_ANULADA <> true ),
                                                      Filter( fact_NOTAS_VENTA, VENDEDOR_CODIGO = gVendCod, NOTA_SALDO_PENDIENTE > 0, NOTA_ANULADA <> true ) ),
                                                  IsBlank( s )
                                                  Or StartsWith( NOTA_NUMERO, s )
                                                  Or StartsWith( CLIENTE_NOMBRE, s )
                                                  Or StartsWith( VENDEDOR_NOMBRE, s )
                                              ),
                                              "NOTA_FECHA", SortOrder.Descending
                                          )
                                      )
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =Set( gNotaCbr, ThisItem );
                                      Set( gSaldoDisp,
                                          Coalesce( ThisItem.NOTA_SALDO_PENDIENTE, 0 ) -
                                          Coalesce( Sum( Filter( colCobrPend, NOTA_NUMERO = ThisItem.NOTA_NUMERO ), COBRANZA_MONTO ), 0 ) );
                                      ClearCollect( colCbrNotaLineas,
                                          Filter( fact_NOTA_LINEAS, NOTA_NUMERO = ThisItem.NOTA_NUMERO ) );
                                      Reset( txtCobranzaMonto )
                                    TemplateFill: =If( ThisItem.ID = gNotaCbr.ID, gAzulBg, Color.White )
                                    TemplateSize: =If( gVeTodasLasNotas, 94, 72 )
                                  Children:
                                    - lblGPedSaldo:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: |+
                                            =Align.Right
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: |-
                                            =If( Coalesce( Sum( Filter( colCobrPend, NOTA_NUMERO = ThisItem.NOTA_NUMERO ), COBRANZA_MONTO ), 0 ) > 0,
                                                ColorValue("#8A5A00"),
                                                gTexto )
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =34
                                          OnSelect: =Select(Parent)
                                          Size: =11.5
                                          Text: |-
                                            =With(
                                                { pend: Coalesce( Sum( Filter( colCobrPend, NOTA_NUMERO = ThisItem.NOTA_NUMERO ), COBRANZA_MONTO ), 0 ) },
                                                "Saldo: Bs " & Text( ThisItem.NOTA_SALDO_PENDIENTE - pend, "#,##0.00" ) &
                                                If( pend > 0, "  ⏳", "" )
                                            )
                                          Width: =Parent.TemplateWidth * 0.55 - 12
                                          X: =Parent.TemplateWidth * 0.45
                                          Y: =34
                                    - lblGPedTotal:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =34
                                          OnSelect: =Select(Parent)
                                          Size: =11.5
                                          Text: ="Bs " & Text( ThisItem.NOTA_TOTAL, "#,##0.00" )
                                          Width: =Parent.TemplateWidth * 0.45
                                          Y: =34
                                    - lblGPedFecha:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Right
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =RGBA(120, 120, 120, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =30
                                          OnSelect: =Select(Parent)
                                          Size: =11
                                          Text: =ThisItem.CLIENTE_NOMBRE
                                          Width: =Parent.TemplateWidth * 0.55 - 12
                                          X: =Parent.TemplateWidth * 0.45
                                          Y: =2
                                    - lblGPedNro:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =RGBA(120, 120, 120, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =30
                                          OnSelect: =Select(Parent)
                                          Size: =10
                                          Text: ="Nota " & ThisItem.NOTA_NUMERO & "  ·  " & Text( ThisItem.NOTA_FECHA, "dd/mm" )
                                          Width: =Parent.TemplateWidth * 0.45
                                          Y: =2
                                    - rectGPedSeparador:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Fill: =RGBA(230, 230, 230, 1)
                                          Height: =1
                                          OnSelect: =Select(Parent)
                                          Width: =Parent.Width - 24
                                          X: |+
                                            =12
                                          Y: =Parent.TemplateHeight - 4
                                    - lblGPedVendedor:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =RGBA(120, 120, 120, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =24
                                          OnSelect: =Select(Parent)
                                          Size: =10
                                          Text: =ThisItem.VENDEDOR_NOMBRE
                                          Visible: =gVeTodasLasNotas
                                          Width: =Parent.TemplateWidth
                                          Y: =66
                              - lblCobranzaSinDeudas:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =25
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: ="No hay notas de venta con saldo pendiente"
                                    Visible: =CountRows( galCobranzaPedidos.AllItems ) = 0
                              - ctnCobranzaDetallePedido:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =galCobranzaDetalle.Height + 36
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =2
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    Visible: =Not( IsBlank( gNotaCbr ) )
                                  Children:
                                    - lblDetallePedidoTitulo:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =20
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =12
                                          Text: ="Detalle de la nota"
                                    - galCobranzaDetalle:
                                        Control: Gallery@2.15.0
                                        Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          FillPortions: =0
                                          Height: =Min( Max( CountRows( colCbrNotaLineas ) * 60, 60 ), 240 )
                                          Items: =colCbrNotaLineas
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          TemplateSize: |+
                                            =60
                                        Children:
                                          - lblGDetSub:
                                              Control: Label@2.5.1
                                              Properties:
                                                BorderColor: =RGBA(0, 18, 107, 1)
                                                Font: =Font.'Open Sans'
                                                Height: =15
                                                OnSelect: =Select(Parent)
                                                Size: =11
                                                Text: ="Bs " & Text( ThisItem.LINEA_CANTIDAD * ThisItem.LINEA_PRECIO_UNITARIO, "#,##0.00" )
                                                Width: =Parent.TemplateWidth - 24
                                                Y: =42
                                          - lblGDetCant:
                                              Control: Label@2.5.1
                                              Properties:
                                                BorderColor: =RGBA(0, 18, 107, 1)
                                                Font: =Font.'Open Sans'
                                                Height: =15
                                                OnSelect: =Select(Parent)
                                                Size: =11
                                                Text: =ThisItem.LINEA_CANTIDAD & " " & ThisItem.PRODUCTO_UNIDAD & " × Bs " & Text( ThisItem.LINEA_PRECIO_UNITARIO, "#,##0.00" )
                                                Width: =Parent.TemplateWidth - 24
                                                Y: =27
                                          - lblGDetProd:
                                              Control: Label@2.5.1
                                              Properties:
                                                BorderColor: =RGBA(0, 18, 107, 1)
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Lighter
                                                Height: =15
                                                OnSelect: =Select(Parent)
                                                Size: =11
                                                Text: =ThisItem.PRODUCTO_DESCRIPCION
                                                Width: =Parent.TemplateWidth - 24
                                                Y: =12
                                    - lblCobranzaSaldo:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =RGBA(200, 30, 30, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =40
                                          LayoutMinHeight: =40
                                          LayoutMinWidth: =16
                                          Size: =11
                                          Text: |-
                                            ="Saldo pendiente: Bs " & Text( Coalesce( gNotaCbr.NOTA_SALDO_PENDIENTE, 0 ), "#,##0.00" ) &
                                            If( gSaldoDisp < Coalesce( gNotaCbr.NOTA_SALDO_PENDIENTE, 0 ),
                                                Char(10) & "Disponible para cobrar: Bs " & Text( gSaldoDisp, "#,##0.00" ),
                                                "" )
                                          Width: |+
                                            =340
                  - lblCobranzaTitulo:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gTexto
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="DATOS DEL COBRO"
                  - cardCobranzaDatos:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =gLinea
                        BorderThickness: =1
                        Fill: =Color.White
                        FillPortions: =0
                        Height: =260
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Visible: =Not( IsBlank( gNotaCbr ) )
                      Children:
                        - ctnCobranzaDatosCuerpo:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Height: =Parent.Height
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              Width: =Parent.Width
                            Children:
                              - ctnCobranzaHuboPago:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =25
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                  Children:
                                    - lblCobranzaHuboPagoTitulo:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =11
                                          Text: ="¿Hubo pago?"
                              - ctnCobranzaHuboPagoBotones:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =40
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    Width: =Parent.Width
                                  Children:
                                    - btnCobranzaPagoSi:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =ColorFade(Self.Fill, -15%)
                                          Color: =If(gHuboPago = true, RGBA(255, 255, 255, 1), RGBA(60, 60, 60, 1))
                                          DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                          Fill: =If(gHuboPago = true, RGBA(20, 60, 130, 1), RGBA(240, 242, 245, 1))
                                          FillPortions: =1
                                          Font: =Font.'Open Sans'
                                          Height: =Parent.Height
                                          HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Set(gHuboPago, true)
                                          PressedBorderColor: =Self.Fill
                                          PressedColor: =Self.Fill
                                          PressedFill: =Self.Color
                                          Size: =10
                                          Text: ="Sí"
                                          Width: =100
                                    - btnCobranzaPagoNo:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =ColorFade(Self.Fill, -15%)
                                          Color: =If(gHuboPago = false And Not(IsBlank(gHuboPago)), RGBA(255, 255, 255, 1), RGBA(60, 60, 60, 1))
                                          DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                          Fill: =If(gHuboPago = false And Not(IsBlank(gHuboPago)), RGBA(20, 60, 130, 1), RGBA(240, 242, 245, 1))
                                          FillPortions: =1
                                          Font: =Font.'Open Sans'
                                          Height: =Parent.Height
                                          HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Set( gHuboPago, false );
                                            Set( gTipoPago, "" );
                                            Set( gCobranzaMonto, 0 );
                                            Reset( txtCobranzaMonto )
                                          PressedBorderColor: =Self.Fill
                                          PressedColor: =Self.Fill
                                          PressedFill: =Self.Color
                                          Size: =10
                                          Text: ="No"
                                          Width: =100
                              - ctnCobranzaTipoPago:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =65
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    Visible: =gHuboPago
                                  Children:
                                    - lblCobranzaTipoPagoTitulo:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =25
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingLeft: =0
                                          Size: =11
                                          Text: ="Tipo de pago"
                                    - ctnCobranzaTipoPagoBotones:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =30
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =15
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =8
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          PaddingTop: =8
                                        Children:
                                          - btnCobranzaTipoCompleto:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                BorderColor: =ColorFade(Self.Fill, -15%)
                                                Color: =If(gTipoPago = "Completo", RGBA(255, 255, 255, 1), RGBA(60, 60, 60, 1))
                                                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                                Fill: =If(gTipoPago = "Completo", RGBA(20, 60, 130, 1), RGBA(240, 242, 245, 1))
                                                FillPortions: =1
                                                Font: =Font.'Open Sans'
                                                Height: =Parent.Height
                                                HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                                HoverColor: =RGBA(255, 255, 255, 1)
                                                HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                OnSelect: |-
                                                  =Set( gTipoPago, "Completo" );
                                                  Set( gCobranzaMonto, Coalesce( gNotaCbr.NOTA_SALDO_PENDIENTE, 0 ) );
                                                  Reset( txtCobranzaMonto )
                                                PressedBorderColor: =Self.Fill
                                                PressedColor: =Self.Fill
                                                PressedFill: =Self.Color
                                                Size: =10
                                                Text: ="Completo"
                                                Width: =100
                                          - btnCobranzaTipoParcial:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                BorderColor: =ColorFade(Self.Fill, -15%)
                                                Color: =If(gTipoPago = "Parcial", RGBA(255, 255, 255, 1), RGBA(60, 60, 60, 1))
                                                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                                Fill: =If(gTipoPago = "Parcial", RGBA(20, 60, 130, 1), RGBA(240, 242, 245, 1))
                                                FillPortions: =1
                                                Font: =Font.'Open Sans'
                                                Height: =Parent.Height
                                                HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                                HoverColor: =RGBA(255, 255, 255, 1)
                                                HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                OnSelect: |-
                                                  =Set( gTipoPago, "Parcial" );
                                                  Set( gCobranzaMonto, 0 );
                                                  Reset( txtCobranzaMonto )
                                                PressedBorderColor: =Self.Fill
                                                PressedColor: =Self.Fill
                                                PressedFill: =Self.Color
                                                Size: =10
                                                Text: ="Parcial"
                                                Width: =100
                                          - btnCobranzaTipoAnticipo:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                BorderColor: =ColorFade(Self.Fill, -15%)
                                                Color: =If(gTipoPago = "Anticipo", RGBA(255, 255, 255, 1), RGBA(60, 60, 60, 1))
                                                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                                Fill: =If(gTipoPago = "Anticipo", RGBA(20, 60, 130, 1), RGBA(240, 242, 245, 1))
                                                FillPortions: =1
                                                Font: =Font.'Open Sans'
                                                Height: =Parent.Height
                                                HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                                HoverColor: =RGBA(255, 255, 255, 1)
                                                HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                OnSelect: |-
                                                  =Set( gTipoPago, "Anticipo" );
                                                  Set( gCobranzaMonto, 0 );
                                                  Reset( txtCobranzaMonto )
                                                PressedBorderColor: =Self.Fill
                                                PressedColor: =Self.Fill
                                                PressedFill: =Self.Color
                                                Size: =10
                                                Text: ="Anticipo"
                                                Width: =100
                              - ctnCobranzaMonto:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =45
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    Visible: =gHuboPago And Not( IsBlank( gTipoPago ) )
                                  Children:
                                    - lblCobranzaMontoTitulo:
                                        Control: Label@2.5.1
                                        Properties:
