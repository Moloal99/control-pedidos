                              - frmCobranza:
                                  Control: Form@2.4.4
                                  Variant: Classic
                                  Layout: Vertical
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    DataSource: =fact_COBRANZAS
                                    DefaultMode: =FormMode.New
                                    FillPortions: =0
                                    Height: =If(gHuboPago And (gFormaPago = "Transferencia" Or gFormaPago = "Banco"), 190, 1)
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnFailure: =Notify( "No se pudo guardar la cobranza. Intentá de nuevo.", NotificationType.Error )
                                    OnSuccess: |-
                                      =/* ============================================================
                                         frmCobranza . OnSuccess
                                         1) Completa la fila que creo SubmitForm. Si ese Patch falla,
                                            borra la fila para que no quede una cobranza a medias.
                                         2) Si todo salio bien y hubo pago, avisa por correo al rol
                                            cobranzas para que entre a confirmarla.
                                         Requiere en App.OnStart:
                                            Set( gCbrOk, false );  Set( gCbrNuevaId, 0 );
                                            Set( gMailRolCobranzas, "" );  Set( gMailCbrDest, "" );
                                         ============================================================ */

                                      Set( gCbrOk, false );
                                      Set( gCbrNuevaId, frmCobranza.LastSubmit.ID );

                                      With(
                                          { reg: LookUp( fact_COBRANZAS, ID = gCbrNuevaId ) },

                                          If( IsBlank( reg ),

                                              /* No se encontro la fila recien creada: NO se hace Patch,
                                                 porque un Patch con registro en blanco crearia OTRA fila. */
                                              Notify( "No se encontró la cobranza recién creada. No se completaron los datos.",
                                                      NotificationType.Error ),

                                              IfError(
                                                  Patch( fact_COBRANZAS, reg,
                                                      {
                                                          COBRANZA_TITULO:   gNotaCbr.NOTA_NUMERO,
                                                          NOTA_NUMERO:       gNotaCbr.NOTA_NUMERO,
                                                          PROFORMA_CLAVE:    gNotaCbr.PROFORMA_CLAVE,
                                                          PEDIDO_NUMERO:     gNotaCbr.PEDIDO_NUMERO,
                                                          dim_CLIENTES_ID: {
                                                              '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                                              Id:    gNotaCbr.dim_CLIENTES_ID.Id,
                                                              Value: gNotaCbr.dim_CLIENTES_ID.Value
                                                          },
                                                          CLIENTE_CODIGO:      gNotaCbr.CLIENTE_CODIGO,
                                                          CLIENTE_NOMBRE:      gNotaCbr.CLIENTE_NOMBRE,
                                                          VENDEDOR_CODIGO:     gNotaCbr.VENDEDOR_CODIGO,
                                                          VENDEDOR_NOMBRE:     gNotaCbr.VENDEDOR_NOMBRE,

                                                          /* Quien registro el cobro, si no es el vendedor de la nota */
                                                          CARGADO_POR: If( gNotaCbr.VENDEDOR_CODIGO <> gUsrCod, gUsrNom, "" ),
                                                          COBRANZA_FECHA:      Now(),
                                                          COBRANZA_HUBO_PAGO:  gHuboPago,
                                                          COBRANZA_TIPO_PAGO:  { Value: gTipoPago },
                                                          COBRANZA_MONTO:      If( gHuboPago, gCobranzaMonto, 0 ),
                                                          COBRANZA_FORMA_PAGO: { Value: gFormaPago },
                                                          COBRANZA_FECHA_PROXIMO_PAGO: dtpCobranzaProxPago.SelectedDate,
                                                          NOTA_TOTAL:             gNotaCbr.NOTA_TOTAL,
                                                          COBRANZA_SALDO_ANTES:   Coalesce( gNotaCbr.NOTA_SALDO_PENDIENTE, 0 ),
                                                          COBRANZA_SALDO_DESPUES: Coalesce( gNotaCbr.NOTA_SALDO_PENDIENTE, 0 ) -
                                                                                  If( gHuboPago, gCobranzaMonto, 0 ),
                                                          COBRANZA_ESTADO: { Value: "Pendiente de confirmación" }
                                                      }
                                                  ); false,

                                                  Notify( "No llegó la respuesta del servidor al completar la cobranza.",
                                                          NotificationType.Error )
                                              )
                                          )
                                      );

                                      /* Veredicto: solo es exito si la lista no reporto ningun error */
                                      Set( gCbrOk, IsEmpty( Errors( fact_COBRANZAS ) ) );


                                      If( Not( gCbrOk ),

                                          /* ---------- FALLO: se deshace la fila incompleta ---------- */
                                          IfError(
                                              Remove( fact_COBRANZAS, LookUp( fact_COBRANZAS, ID = gCbrNuevaId ) ); false,
                                              Notify( "Quedó una cobranza incompleta en el sistema (ID " & gCbrNuevaId &
                                                      "). Avisá para que la borren a mano.", NotificationType.Warning )
                                          );

                                          /* Se limpia solo el formulario para poder volver a adjuntar.
                                             gNotaCbr y el monto quedan cargados para reintentar. */
                                          ResetForm( frmCobranza );

                                          Notify( "La cobranza NO se registró y se deshizo lo que se había creado. " &
                                                  "Los datos del cobro siguen cargados: volvé a adjuntar el comprobante y guardá de nuevo.",
                                                  NotificationType.Error ),


                                          /* ---------- OK ---------- */

                                          /* --- Aviso al rol cobranzas, solo si hubo pago --- */
                                          If( gHuboPago,

                                              Set( gMailCbrDest,
                                                  Trim(
                                                      If( Not( IsBlank( gMailRolCobranzas ) ), gMailRolCobranzas & ";", "" ) &
                                                      "samuel.jara@analytico.com.py"
                                                  )
                                              );

                                              Set( gMailCbrCuerpo,
                                                  "<div style=""font-family:Segoe UI,Arial,sans-serif;color:#1F2937;max-width:640px;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;background:#fff"">" &

                                                  "<div style=""background:#0B2E59;color:#fff;padding:16px 20px"">" &
                                                  "<div style=""font-size:18px;font-weight:600"">Cobranza pendiente de confirmación</div>" &
                                                  "<div style=""font-size:13px;opacity:0.85"">Nota " & gNotaCbr.NOTA_NUMERO &
                                                  " &middot; " & Text( Now(), "dd/mm/yyyy hh:mm" ) & "</div>" &
                                                  "</div>" &

                                                  "<div style=""padding:18px 20px"">" &
                                                  "<table style=""width:100%;font-size:14px;border-collapse:collapse"">" &

                                                  "<tr><td style=""padding:5px 0;color:#6B7280;width:170px"">Cliente</td>" &
                                                  "<td style=""padding:5px 0;font-weight:600"">" & gNotaCbr.CLIENTE_NOMBRE & "</td></tr>" &

                                                  "<tr><td style=""padding:5px 0;color:#6B7280"">Nota de venta</td>" &
                                                  "<td style=""padding:5px 0"">" & gNotaCbr.NOTA_NUMERO & "</td></tr>" &

                                                  "<tr><td style=""padding:5px 0;color:#6B7280"">Pedido</td>" &
                                                  "<td style=""padding:5px 0"">" & gNotaCbr.PEDIDO_NUMERO & "</td></tr>" &

                                                  "<tr><td style=""padding:5px 0;color:#6B7280"">Vendedor de la nota</td>" &
                                                  "<td style=""padding:5px 0"">" & gNotaCbr.VENDEDOR_NOMBRE & "</td></tr>" &

                                                  "<tr><td style=""padding:5px 0;color:#6B7280"">Registró el cobro</td>" &
                                                  "<td style=""padding:5px 0"">" & gUsuario & "</td></tr>" &

                                                  "<tr><td colspan=""2"" style=""padding:8px 0""><hr style=""border:0;border-top:1px solid #E5E7EB""></td></tr>" &

                                                  "<tr><td style=""padding:5px 0;color:#6B7280"">Monto cobrado</td>" &
                                                  "<td style=""padding:5px 0;font-weight:700;font-size:16px;color:#0B2E59"">Bs " &
                                                  Text( gCobranzaMonto, "#,##0.00" ) & "</td></tr>" &

                                                  "<tr><td style=""padding:5px 0;color:#6B7280"">Forma de pago</td>" &
                                                  "<td style=""padding:5px 0"">" & gFormaPago & "</td></tr>" &

                                                  "<tr><td style=""padding:5px 0;color:#6B7280"">Tipo de pago</td>" &
                                                  "<td style=""padding:5px 0"">" & gTipoPago & "</td></tr>" &

                                                  "<tr><td style=""padding:5px 0;color:#6B7280"">Saldo antes</td>" &
                                                  "<td style=""padding:5px 0"">Bs " &
                                                  Text( Coalesce( gNotaCbr.NOTA_SALDO_PENDIENTE, 0 ), "#,##0.00" ) & "</td></tr>" &

                                                  "<tr><td style=""padding:5px 0;color:#6B7280"">Saldo después de confirmar</td>" &
                                                  "<td style=""padding:5px 0"">Bs " &
                                                  Text( Coalesce( gNotaCbr.NOTA_SALDO_PENDIENTE, 0 ) - gCobranzaMonto, "#,##0.00" ) &
                                                  "</td></tr>" &

                                                  "</table>" &

                                                  "<div style=""margin-top:16px;padding:12px 14px;background:#FDF1DC;color:#8A5A00;border-radius:8px;font-size:13px"">" &
                                                  "El saldo de la nota <b>no cambió todavía</b>. Entrá a Tickets &rsaquo; Cobranzas, " &
                                                  "revisá el comprobante y confirmá el cobro con su número." &
                                                  "</div>" &

                                                  "</div></div>"
                                              );

                                              IfError(
                                                  Office365Outlook.SendEmailV2(
                                                      gMailCbrDest,
                                                      "Cobranza pendiente · Nota " & gNotaCbr.NOTA_NUMERO & " · " &
                                                          gNotaCbr.CLIENTE_NOMBRE & " · Bs " & Text( gCobranzaMonto, "#,##0.00" ),
                                                      gMailCbrCuerpo
                                                  ); false,
                                                  Notify( "La cobranza se registró pero el aviso NO se envió a: " & gMailCbrDest &
                                                          ". Avisales a mano.", NotificationType.Warning )
                                              )
                                          );

                                          Notify(
                                              If( gHuboPago,
                                                  "Cobranza registrada por Bs " & Text( gCobranzaMonto, "#,##0.00" ) &
                                                  ". Queda pendiente de confirmación.",
                                                  "Visita sin pago registrada." ),
                                              NotificationType.Success );

                                          ResetForm( frmCobranza );
                                          Set( gNotaCbr, Blank() );
                                          Clear( colCbrNotaLineas );
                                          Set( gHuboPago, false );
                                          Set( gTipoPago, "" );
                                          Set( gFormaPago, "" );
                                          Set( gCobranzaMonto, 0 );
                                          Reset( txtCobranzaMonto )
                                      )
                                    Width: =Parent.Width
                                  Children:
                                    - Datos adjuntos_DataCard1:
                                        Control: TypedDataCard@1.0.7
                                        Variant: ClassicAttachmentsEdit
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
