            - btnGuardarCobranza_1:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =gRojo
                  Font: =Font.'Segoe UI'
                  Height: =56
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |-
                    =Set( gCobranzaMonto,
                        If( gTipoPago = "Completo",
                            gSaldoDisp,
                            Value( txtCobranzaMonto.Text ) ) );

                    If(
                        IsBlank( gNotaCbr ),
                        Notify( "Seleccioná una nota de venta", NotificationType.Error ),

                        gHuboPago And gSaldoDisp <= 0,
                        Notify( "Esta nota ya tiene cargado todo su saldo esperando aprobación. No se puede agregar otra cobranza hasta que el equipo de cobranza la revise.", NotificationType.Error ),

                        gHuboPago And IsBlank( gTipoPago ),
                        Notify( "Indicá el tipo de pago", NotificationType.Error ),

                        gHuboPago And gCobranzaMonto <= 0,
                        Notify( "El monto debe ser mayor a cero", NotificationType.Error ),

                        gHuboPago And gCobranzaMonto > gSaldoDisp,
                        Notify( "El monto no puede superar lo disponible para cobrar (Bs " &
                                Text( gSaldoDisp, "#,##0.00" ) &
                                If( gSaldoDisp < Coalesce( gNotaCbr.NOTA_SALDO_PENDIENTE, 0 ),
                                    ". El saldo de la nota es Bs " &
                                    Text( Coalesce( gNotaCbr.NOTA_SALDO_PENDIENTE, 0 ), "#,##0.00" ) &
                                    ", pero ya hay pagos cargados esperando aprobación", "" ) & ")",
                                NotificationType.Error ),

                        gHuboPago And IsBlank( gFormaPago ),
                        Notify( "Indicá la forma de pago", NotificationType.Error ),

                        /* El comprobante es obligatorio solo cuando NO es efectivo.
                           En efectivo no hay papel que adjuntar. */
                        gHuboPago And gFormaPago <> "Efectivo" And CountRows( attComprobante.Attachments ) = 0,
                        Notify( "Adjuntá el comprobante de la " & Lower( gFormaPago ), NotificationType.Error ),

                        Not( gHuboPago ) And IsBlank( dtpCobranzaProxPago.SelectedDate ),
                        Notify( "Indicá la fecha del próximo pago", NotificationType.Error ),

                        SubmitForm( frmCobranza )
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =gRojoDark
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =15
                  Text: ="Guardar cobranza"
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =712
